      if (this._comboTimes.length >= 3 && !this._comboActive) this._activateCombo();
      if (this._collected >= this._cfg.debris) {
        if (!this._cfg.hasBoss || !this._bossExtra) this._endGame(true);
      }
    }

    _activateCombo() {
      this._comboActive = true; this._comboTimer = 5;
      const { x, y } = this._player;
      const comboTxt = this.add.text(x, y - 50, 'x2 COMBO!', {
        font: 'bold 24px "Courier New"', fill: '#ffd700',
        shadow: { offsetX:2, offsetY:2, color:'#000000', fill:true }
      }).setDepth(60).setOrigin(0.5);
      this.tweens.add({ targets: comboTxt, y: y - 90, alpha: 0, duration: 1800, onComplete: () => comboTxt.destroy() });
      this.cameras.main.shake(50, 0.002);
    }

    _scatterDebris(satellite, piece) {
      if (!piece.active) return;
      if (piece._isLarge) {
        const origVx = piece.body.velocity.x, origVy = piece.body.velocity.y;
        const origAng = Math.atan2(origVy, origVx);
        const origSpd = Math.sqrt(origVx*origVx + origVy*origVy) || 80;
        const px = piece.x, py = piece.y, variant = piece._variant || 0;
        piece.destroy();
        this._glintData = this._glintData.filter(g => g.sprite.active);
        for (let i = 0; i < 2; i++) {
          const spread = (i === 0 ? -1 : 1) * Phaser.Math.FloatBetween(Math.PI/5, Math.PI/2.5);
          const newAng = origAng + spread, spd = origSpd * Phaser.Math.FloatBetween(0.7, 1.3);
          const small  = this._debrisGroup.create(px, py, `debris_${variant}`);
          small.setScale(0.6).setBounce(0.8).setCollideWorldBounds(false).setDepth(15);
          small.setVelocity(Math.cos(newAng)*spd, Math.sin(newAng)*spd);
          small.setAngularVelocity(Phaser.Math.Between(-50, 50));
          small._isLarge = false; small._pts = 5; small._variant = variant;
        }
      } else {
        const ang = Phaser.Math.FloatBetween(0, Math.PI*2);
        piece.setVelocity(Math.cos(ang)*Phaser.Math.Between(70, 160), Math.sin(ang)*Phaser.Math.Between(70, 160));
      }
    }

    _playerHit(player, satellite) {
      if (this._shieldActive || this._hitCooldown > 0) return;
      this._health--;
      this._hitCooldown = 1.6;
      AM.playHitSound();
      this.cameras.main.shake(200, 0.009);
      player.setTint(0xff3300);
      this.time.delayedCall(55, () => { if (player.active) this._updatePlayerTint(); });
      if (this._health <= 0) this._endGame(false);
    }

    _playerHitByBoss(player, bossSprite) {
      if (this._shieldActive || this._hitCooldown > 0) return;
      this._health--;
      this._hitCooldown = 1.8;
      AM.playHitSound();
      this.cameras.main.shake(250, 0.011);
      player.setTint(0xff3300);
      this.time.delayedCall(55, () => { if (player.active) this._updatePlayerTint(); });
      if (this._health <= 0) this._endGame(false);
    }

    _playerHitByEnemyBullet(player, bullet) {
      if (!bullet.active) return;
      bullet.destroy();
      if (this._shieldActive || this._hitCooldown > 0) return;
      this._health--;
      this._hitCooldown = 1.6;
      AM.playHitSound();
      this.cameras.main.shake(200, 0.008);
      player.setTint(0xff3300);
      this.time.delayedCall(55, () => { if (player.active) this._updatePlayerTint(); });
      if (this._health <= 0) this._endGame(false);
    }

    _collectPowerup(player, powerup) {
      const type = powerup.texture.key;
      powerup.destroy();
      this._powerupBobData = this._powerupBobData.filter(d => d.sprite.active);

      switch (type) {
        case 'powerup_shield':
          AM.playPowerUpSound();
          this._shieldActive = true; this._shieldTimer = 8;
          this._updatePlayerTint();
          this._showStatusPop('SHIELD ON  8s', 0x44aaff);
          break;
        case 'powerup_vacuum':
          AM.playRocketBoostSound();
          this._vacuumActive = true; this._vacuumTimer = 10;
          this._updatePlayerTint();
          this._showStatusPop('SUPER VACUUM  10s', 0xffcc00);
          break;
        case 'powerup_speed':
          AM.playSpeedSound();
          this._speedActive = true; this._speedTimer = 8;
          player.setMaxVelocity(460);
          this._updatePlayerTint();
          this._showStatusPop('SPEED BOOST  8s', 0x00ff88);
          this.cameras.main.shake(80, 0.003);
          break;
        case 'powerup_freeze':
          AM.playFreezeSound();
          this._freezeActive = true; this._freezeTimer = 5;
          this._showStatusPop('TIME FREEZE  5s', 0x88ddff);
          this.cameras.main.shake(120, 0.004);
          break;
        case 'powerup_emp':
          AM.playEMPSound();
          this._applyEMP();
          this._showStatusPop('EMP BLAST!', 0xffff44);
          break;
      }
    }

    _showStatusPop(msg, color) {
      const { width } = this.scale;
      const txt = this.add.text(width/2, 90, msg, {
        font: 'bold 18px "Courier New"', fill: '#' + color.toString(16).padStart(6, '0'),
        stroke: '#000000', strokeThickness: 3, backgroundColor: '#00000088', padding: { x:10, y:5 }
      }).setDepth(60).setOrigin(0.5);
      this.tweens.add({ targets: txt, y: 65, alpha: 0, delay: 1200, duration: 800, onComplete: () => txt.destroy() });
    }

    _showSpawnWarning(spawnX, spawnY) {
      const { width, height } = this.scale;
      const dL = spawnX, dR = width-spawnX, dT = spawnY, dB = height-spawnY;
      const minD = Math.min(dL, dR, dT, dB);
      let ax = spawnX, ay = spawnY, rot = 0;
      if      (minD === dT) { ax = spawnX; ay = 20; rot = 0; }
      else if (minD === dB) { ax = spawnX; ay = height-20; rot = Math.PI; }
      else if (minD === dL) { ax = 20; ay = spawnY; rot = -Math.PI/2; }
      else                  { ax = width-20; ay = spawnY; rot = Math.PI/2; }
      const arrow = this.add.image(ax, ay, 'spawn_arrow').setRotation(rot).setDepth(80).setAlpha(0.9);
      this.tweens.add({ targets: arrow, alpha: 0, delay: 1200, duration: 300, onComplete: () => arrow.destroy() });
    }

    // ── TIMER ─────────────────────────────────────────────────────────────────
    _tickTimer() {
      if (!this._introComplete) return;
      this._timeLeft--;
      if (this._timeLeft <= 0) this._endGame(false);
    }

    // ── HUD ───────────────────────────────────────────────────────────────────
    _buildHUD() {
      const { width } = this.scale;
      this._hudBg = this.add.graphics().setDepth(88);
      this._hudBg.fillStyle(0x000022, 0.78); this._hudBg.fillRect(0, 0, width, 46);
      this._hudBg.lineStyle(1, 0x223366, 1); this._hudBg.strokeRect(0, 0, width, 46);

      this._scoreTxt = this.add.text(12, 8, 'SCORE  0', { font: 'bold 18px "Courier New"', fill: '#66eeff' }).setDepth(89);
      this._levelTxt = this.add.text(width/2, 8, `LEVEL ${this._level}`, { font: 'bold 18px "Courier New"', fill: '#aaddff' }).setDepth(89).setOrigin(0.5, 0);
      this._debrisTxt = this.add.text(width/2, 26, `0 / ${this._cfg.debris}`, { font: '13px "Courier New"', fill: '#88ccee' }).setDepth(89).setOrigin(0.5, 0);
      this._timerTxt  = this.add.text(width - 12, 8, `${this._timeLeft}s`, { font: 'bold 20px "Courier New"', fill: '#ccffcc' }).setDepth(89).setOrigin(1, 0);

      this._heartImgs = [];
      for (let i = 0; i < 3; i++) {
        this._heartImgs.push(this.add.image(width - 114 + i * 26, 27, 'heart').setDepth(89).setScale(1.0));
      }

      this._powerupLineTxt = this.add.text(width/2, 54, '', {
        font: 'bold 14px "Courier New"', fill: '#ffffff',
        stroke: '#000000', strokeThickness: 3, backgroundColor: '#00000099', padding: { x:8, y:3 }
      }).setDepth(90).setOrigin(0.5, 0).setAlpha(0);

      // Boss HP bar (hidden until boss spawns)
      if (this._cfg.hasBoss) {
        const barW = 220, barH = 10, barX = width/2 - barW/2, barY = 53;
        this._bossHpBarBg = this.add.graphics().setDepth(89);
        this._bossHpBarBg.fillStyle(0x330000, 0.85); this._bossHpBarBg.fillRoundedRect(barX, barY, barW, barH, 3);
        this._bossHpBarBg.lineStyle(1, 0xff2200, 0.5); this._bossHpBarBg.strokeRoundedRect(barX, barY, barW, barH, 3);
        this._bossHpBarBg.setAlpha(0);

        this._bossHpBarFg = this.add.graphics().setDepth(90).setAlpha(0);
        this._bossHpLbl = this.add.text(width/2, barY - 14, '☠ BOSS', {
          font: 'bold 11px "Courier New"', fill: '#ff4444'
        }).setDepth(90).setOrigin(0.5, 0).setAlpha(0);
      }
    }

    _updateHUD(time) {
      this._scoreTxt.setText(`SCORE  ${this._score}`);
      this._debrisTxt.setText(`${this._collected} / ${this._cfg.debris} debris`);

      let timerColor = '#ccffcc';
      if (this._timeLeft <= 10) {
        timerColor = '#ff2222';
        this._timerTxt.setAlpha(0.6 + 0.4 * Math.sin(time * 0.01));
      } else if (this._timeLeft <= 20) {
        timerColor = '#ffaa00'; this._timerTxt.setAlpha(1);
      } else { this._timerTxt.setAlpha(1); }
      this._timerTxt.setText(`${this._timeLeft}s`).setStyle({ fill: timerColor });

      this._heartImgs.forEach((h, i) => h.setVisible(i < this._health));

      // Power-up countdown line
      const lines = [];
      if (this._shieldActive) lines.push({ text: `SHIELD ${Math.ceil(this._shieldTimer)}s`,     color: '#44ccff' });
      if (this._vacuumActive) lines.push({ text: `VACUUM ${Math.ceil(this._vacuumTimer)}s`,      color: '#ffdd00' });
      if (this._speedActive)  lines.push({ text: `SPEED ${Math.ceil(this._speedTimer)}s`,        color: '#00ff88' });
      if (this._freezeActive) lines.push({ text: `FREEZE ${Math.ceil(this._freezeTimer)}s`,      color: '#88ddff' });

      // If boss HP bar visible, shift power-up line up
      const hasBossBar = this._cfg.hasBoss && this._bossExtra;
      this._powerupLineTxt.setY(hasBossBar ? 68 : 54);

      if (lines.length > 0) {
        const col = lines.length > 1 ? '#ffffff' : lines[0].color;
        this._powerupLineTxt.setText(lines.map(l => l.text).join('  ')).setStyle({ fill: col }).setAlpha(1);
      } else { this._powerupLineTxt.setAlpha(0); }

      // Boss HP bar
      if (this._cfg.hasBoss && this._bossHpBarBg) {
        if (this._bossExtra) {
          this._bossHpBarBg.setAlpha(1); this._bossHpBarFg.setAlpha(1); this._bossHpLbl.setAlpha(1);
          const frac = Math.max(0, this._bossExtra.hp / this._bossExtra.maxHp);
          const barW = 220, barH = 10, barX = this.scale.width/2 - barW/2, barY = 53;
          this._bossHpBarFg.clear();
          const col = this._bossExtra.phase === 2 ? 0xff4400 : 0xff0000;
          this._bossHpBarFg.fillStyle(col, 0.92);
          this._bossHpBarFg.fillRoundedRect(barX, barY, barW * frac, barH, 3);
          if (this._bossExtra.phase === 2) {
            this._bossHpBarFg.fillStyle(0xff8800, 0.4 + 0.3 * Math.sin(time * 0.01));
            this._bossHpBarFg.fillRoundedRect(barX, barY, barW * frac, barH, 3);
          }
        } else {
          this._bossHpBarBg.setAlpha(0);
          if (this._bossHpBarFg) this._bossHpBarFg.setAlpha(0);
          if (this._bossHpLbl)   this._bossHpLbl.setAlpha(0);
        }
      }
    }

    // ── PAUSE MENU (with buttons) ─────────────────────────────────────────────
    _buildPauseOverlay() {
      const { width, height } = this.scale;
      this._pauseOverlay = this.add.container(width/2, height/2).setDepth(100).setVisible(false);

      const bg = this.add.rectangle(0, 0, 380, 220, 0x000033, 0.92).setStrokeStyle(2, 0x4466ff);
      const titleTxt = this.add.text(0, -75, 'PAUSED', {
        font: 'bold 42px "Courier New"', fill: '#ffffff', stroke: '#003399', strokeThickness: 4
      }).setOrigin(0.5);
      const ctrlTxt = this.add.text(0, -30, 'SPACE shoot  •  SHIFT dash  •  WASD move', {
        font: '11px "Courier New"', fill: '#7799bb'
      }).setOrigin(0.5);

      // Resume button
      const resumeBtn = this.add.text(0, 20, '[ RESUME ]', {
        font: 'bold 22px "Courier New"', fill: '#ffffff',
        backgroundColor: '#004400', padding: { x:18, y:9 },
        stroke: '#00cc44', strokeThickness: 2
      }).setOrigin(0.5).setInteractive({ useHandCursor: true });
      resumeBtn.on('pointerover', () => resumeBtn.setStyle({ backgroundColor: '#006600' }));
      resumeBtn.on('pointerout',  () => resumeBtn.setStyle({ backgroundColor: '#004400' }));
      resumeBtn.on('pointerdown', () => this._resume());

      // Main menu button
      const menuBtn = this.add.text(0, 76, '[ MAIN MENU ]', {
        font: '16px "Courier New"', fill: '#8899cc', padding: { x:10, y:6 }
      }).setOrigin(0.5).setInteractive({ useHandCursor: true });
      menuBtn.on('pointerover', () => menuBtn.setStyle({ fill: '#aabbff' }));
      menuBtn.on('pointerout',  () => menuBtn.setStyle({ fill: '#8899cc' }));
      menuBtn.on('pointerdown', () => {
        this.game.registry.set('currentLevel', 1);
        this.game.registry.set('score', 0);
        this.game.registry.set('health', 3);
        AM.stopMusic();
        this.scene.start('MenuScene');
      });

      this._pauseOverlay.add([bg, titleTxt, ctrlTxt, resumeBtn, menuBtn]);
      this.tweens.add({ targets: resumeBtn, scaleX:1.04, scaleY:1.04, duration:800, yoyo:true, repeat:-1 });
    }

    _pause() {
      this._paused = true;
      if (this._gameTimer) this._gameTimer.paused = true;
      this.physics.pause();
      this._pauseOverlay.setVisible(true);
    }
    _resume() {
      this._paused = false;
      if (this._gameTimer) this._gameTimer.paused = false;
      this.physics.resume();
      this._pauseOverlay.setVisible(false);
    }

    // ── END GAME ──────────────────────────────────────────────────────────────
    _endGame(won) {
      if (this._gameEnded) return;
      this._gameEnded = true;
      if (this._gameTimer) this._gameTimer.remove();
      this.physics.pause();

      const isNewEntry = lbInsert(this._score, this._level);
      this.game.registry.set('isNewHighScore', isNewEntry);

      if (won) {
        AM.playLevelCompleteSound();
        this.game.registry.set('score', this._score);
        this.game.registry.set('health', this._health);
        this.time.delayedCall(700, () => {
          if (this._level >= TOTAL_LEVELS) {
            this.scene.start('GameOverScene', { missionComplete: true, score: this._score });
          } else {
            this.scene.start('LevelCompleteScene', { level: this._level, score: this._score, timeLeft: this._timeLeft });
          }
        });
      } else {
        AM.playGameOverSound();
        this.time.delayedCall(600, () => {
          this.scene.start('GameOverScene', { missionComplete: false, score: this._score, level: this._level });
        });
      }
    }
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // LEVEL COMPLETE SCENE
  // ═══════════════════════════════════════════════════════════════════════════
  class LevelCompleteScene extends Phaser.Scene {
    constructor() { super({ key: 'LevelCompleteScene' }); }
    init(data) { this._level = data.level; this._score = data.score; this._timeLeft = data.timeLeft || 0; }

    create() {
      this.game.registry.set('bgColor', 0x000011);
      buildStarfield(this, false);
      buildTextures(this);
      AM.playMenuMusic();

      const { width } = this.scale;
      const isLastLevel = this._level >= TOTAL_LEVELS;
      const timeBonus   = this._timeLeft * 5;
      const totalScore  = this._score + timeBonus;
      const nextLevel   = this._level + 1;
      const nextCfg     = isLastLevel ? null : LEVELS[nextLevel - 1];

      const container = this.add.container(0, -300);
      const panelGfx  = this.add.graphics();
      panelGfx.fillStyle(0x001133, 0.90); panelGfx.fillRoundedRect(width/2 - 270, 80, 540, 440, 14);
      panelGfx.lineStyle(2, isLastLevel ? 0xffcc00 : 0x3366cc, 1); panelGfx.strokeRoundedRect(width/2 - 270, 80, 540, 440, 14);
      container.add(panelGfx);

      const addText = (x, y, txt, style) => {
        const t = this.add.text(x, y, txt, style).setOrigin(0.5);
        container.add(t); return t;
      };

      addText(width/2, 118, `LEVEL ${this._level} COMPLETE!`, {
        font:'bold 38px "Courier New"', fill: isLastLevel ? '#ffdd44' : '#66ff88',
        stroke: isLastLevel ? '#664400' : '#004422', strokeThickness: 5,
        shadow: { color: isLastLevel ? '#ffaa00' : '#00ff88', blur:20, fill:true }
      });
      addText(width/2, 185, 'Score this level:', { font:'17px "Courier New"', fill:'#aaddff' });
      addText(width/2, 213, `${this._score}`, { font:'bold 34px "Courier New"', fill:'#ffdd44', stroke:'#664400', strokeThickness:4 });
      addText(width/2, 260, `Time Bonus: ${this._timeLeft}s × 5 = +${timeBonus} pts`, { font:'17px "Courier New"', fill:'#66ff88' });
      addText(width/2, 292, `Total Score: ${totalScore}`, { font:'bold 26px "Courier New"', fill:'#ffee66', stroke:'#664400', strokeThickness:3 });

      if (!isLastLevel) {
        const hasBoss = nextCfg && nextCfg.hasBoss ? '  •  BOSS!' : '';
        addText(width/2, 340, `Next up — Level ${nextLevel}`, { font:'16px "Courier New"', fill:'#88aacc' });
        addText(width/2, 366, `${nextCfg.debris} debris  •  ${nextCfg.timer}s  •  ${nextCfg.enemies} enemies${hasBoss}`, { font:'18px "Courier New"', fill:'#aabbdd' });
      } else {
        addText(width/2, 348, 'ALL 5 LEVELS CLEARED!', { font:'bold 22px "Courier New"', fill:'#ffcc00', stroke:'#664400', strokeThickness:3 });
        addText(width/2, 378, "Earth's orbit is spotless.", { font:'16px "Courier New"', fill:'#aaffcc' });
      }

      const btnLabel = isLastLevel ? '[ MISSION COMPLETE ]' : '[ NEXT LEVEL ]';
      const btn = this.add.text(width/2, 432, btnLabel, {
        font:'bold 24px "Courier New"', fill:'#ffffff',
        backgroundColor: isLastLevel ? '#443300' : '#004400',
        padding:{x:20,y:12}, stroke: isLastLevel ? '#ffaa00' : '#00cc44', strokeThickness:3
      }).setOrigin(0.5).setInteractive({ useHandCursor:true });
      container.add(btn);
      btn.on('pointerover', () => btn.setStyle({ backgroundColor: isLastLevel ? '#665500' : '#006600' }));
      btn.on('pointerout',  () => btn.setStyle({ backgroundColor: isLastLevel ? '#443300' : '#004400' }));
      btn.on('pointerdown', () => {
        if (isLastLevel) {
          this.scene.start('GameOverScene', { missionComplete:true, score:totalScore });
        } else {
          this.game.registry.set('currentLevel', nextLevel);
          this.game.registry.set('score', totalScore);
          AM.stopMusic(); AM.playGameMusic();
          this.scene.start('GameScene');
        }
      });
      this.tweens.add({ targets: btn, scaleX:1.05, scaleY:1.05, duration:900, yoyo:true, repeat:-1 });
      this.tweens.add({ targets: container, y:0, duration:400, ease:'Power2.easeOut' });
    }
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // GAME OVER SCENE
  // ═══════════════════════════════════════════════════════════════════════════
  class GameOverScene extends Phaser.Scene {
    constructor() { super({ key: 'GameOverScene' }); }
    init(data) {
      this._missionComplete = data.missionComplete;
      this._score           = data.score;
      this._level           = data.level || TOTAL_LEVELS;
    }

    create() {
      this.game.registry.set('bgColor', 0x000011);
      buildStarfield(this, false);
      buildTextures(this);
      AM.playMenuMusic();

      const { width } = this.scale;
      const panel = this.add.graphics();
      panel.fillStyle(0x110011, 0.88); panel.fillRoundedRect(width/2 - 280, 70, 560, 440, 14);
      panel.lineStyle(2, this._missionComplete ? 0x33cc66 : 0xcc3333, 1);
      panel.strokeRoundedRect(width/2 - 280, 70, 560, 440, 14);

      if (this._missionComplete) {
        this.add.text(width/2, 112, 'MISSION COMPLETE', {
          font:'bold 38px "Courier New"', fill:'#66ff88',
          stroke:'#003322', strokeThickness:6, shadow:{color:'#00ff88',blur:28,fill:true}
        }).setOrigin(0.5);
        this.add.text(width/2, 166, "Earth's orbit is spotless.\nThe VIP cruiser docks safely.", {
          font:'16px "Courier New"', fill:'#aaffcc', align:'center', lineSpacing:5
        }).setOrigin(0.5);
      } else {
        this.add.text(width/2, 112, 'MISSION FAILED', {
          font:'bold 40px "Courier New"', fill:'#ff4444',
          stroke:'#330000', strokeThickness:6, shadow:{color:'#ff0000',blur:28,fill:true}
        }).setOrigin(0.5);
        this.add.text(width/2, 166, `Failed at Level ${this._level}\nOrbit still full of junk!`, {
          font:'16px "Courier New"', fill:'#ffaaaa', align:'center', lineSpacing:5
        }).setOrigin(0.5);
      }

      this.add.text(width/2, 224, 'TOTAL SCORE', { font:'16px "Courier New"', fill:'#aabbcc' }).setOrigin(0.5);
      this.add.text(width/2, 258, `${this._score}`, {
        font:'bold 44px "Courier New"', fill:'#ffdd44', stroke:'#664400', strokeThickness:4
      }).setOrigin(0.5);

      const stars = this._score >= 300 ? '★★★' : this._score >= 150 ? '★★☆' : '★☆☆';
      this.add.text(width/2, 316, stars, { font:'36px "Courier New"', fill:'#ffcc00' }).setOrigin(0.5);

      const isNew = this.game.registry.get('isNewHighScore');
      const best  = lbBest();
      if (isNew) {
        const newHSTxt = this.add.text(width/2, 358, 'NEW HIGH SCORE!', {
          font:'bold 18px "Courier New"', fill:'#ffd700', stroke:'#664400', strokeThickness:3
        }).setOrigin(0.5);
        this.tweens.add({ targets: newHSTxt, alpha: 0.2, duration: 500, yoyo:true, repeat:-1 });
      } else if (best > 0) {
        this.add.text(width/2, 358, `Your best: ${best}`, { font:'14px "Courier New"', fill:'#8899aa' }).setOrigin(0.5);
      }

      const btnLabel = this._missionComplete ? '[ PLAY AGAIN ]' : '[ RESTART FROM LEVEL 1 ]';
      const btn = this.add.text(width/2, 400, btnLabel, {
        font:'bold 21px "Courier New"', fill:'#ffffff',
        backgroundColor:'#220033', padding:{x:18,y:11}, stroke:'#6633cc', strokeThickness:3
      }).setOrigin(0.5).setInteractive({ useHandCursor:true });
      btn.on('pointerover', () => btn.setStyle({ backgroundColor:'#440066' }));
      btn.on('pointerout',  () => btn.setStyle({ backgroundColor:'#220033' }));
      btn.on('pointerdown', () => {
        this.game.registry.set('currentLevel', 1);
        this.game.registry.set('score', 0);
        this.game.registry.set('health', 3);
        this.game.registry.set('isNewHighScore', false);
        AM.stopMusic();
        this.scene.start('MenuScene');
      });
      this.tweens.add({ targets: btn, scaleX:1.04, scaleY:1.04, duration:900, yoyo:true, repeat:-1 });

      const menuBtn = this.add.text(width/2, 452, '[ MAIN MENU ]', {
        font:'16px "Courier New"', fill:'#8899cc', padding:{x:10,y:6}
      }).setOrigin(0.5).setInteractive({ useHandCursor:true });
      menuBtn.on('pointerover', () => menuBtn.setStyle({ fill:'#aabbff' }));
      menuBtn.on('pointerout',  () => menuBtn.setStyle({ fill:'#8899cc' }));
      menuBtn.on('pointerdown', () => {
        this.game.registry.set('currentLevel', 1);
        this.game.registry.set('score', 0);
        this.game.registry.set('health', 3);
        this.game.registry.set('isNewHighScore', false);
        this.scene.start('MenuScene');
      });
    }
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // PHASER GAME CONFIG
  // ═══════════════════════════════════════════════════════════════════════════
  const config = {
    type: Phaser.AUTO,
    width:  800,
    height: 600,
    parent: document.body,
    backgroundColor: '#000011',
    physics: {
      default: 'arcade',
      arcade: { gravity: { x:0, y:0 }, debug: false }
    },
    scene: [MenuScene, GameScene, LevelCompleteScene, GameOverScene]
  };

  const game = new Phaser.Game(config);
  </script>
</body>
</html>
