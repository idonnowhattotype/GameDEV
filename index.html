<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Cosmic Cleanup: The Space Janitor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    canvas { display: block; box-shadow: 0 0 60px #0044aa66; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.88.2/dist/phaser.min.js"></script>
  <script>
  'use strict';

  // ═══════════════════════════════════════════════════════════════════════════
  // LEVEL CONFIGURATION TABLE
  // enemyTypes: 'seeker' (seeks player), 'bomber' (drops debris), 'patrol' (circles a point)
  // hasBoss / bossHp: level 5 spawns a boss
  // ═══════════════════════════════════════════════════════════════════════════
  const LEVELS = [
    { debris:15, timer:60, enemies:2, enemySpeed:60,  powerups:2, bg:0x0a0a2e, enemyHp:3, respawnDelay:12000, enemyCap:3, enemyTypes:['seeker','seeker'],                   hasBoss:false },
    { debris:18, timer:55, enemies:3, enemySpeed:80,  powerups:2, bg:0x0d0a2e, enemyHp:3, respawnDelay:10000, enemyCap:4, enemyTypes:['seeker','seeker','bomber'],          hasBoss:false },
    { debris:20, timer:50, enemies:3, enemySpeed:100, powerups:3, bg:0x0a1a2e, enemyHp:4, respawnDelay: 8000, enemyCap:5, enemyTypes:['seeker','bomber','patrol'],          hasBoss:false },
    { debris:22, timer:45, enemies:4, enemySpeed:120, powerups:2, bg:0x1a0a0e, enemyHp:4, respawnDelay: 6000, enemyCap:6, enemyTypes:['seeker','seeker','bomber','patrol'], hasBoss:false },
    { debris:25, timer:40, enemies:4, enemySpeed:140, powerups:3, bg:0x1a0505, enemyHp:5, respawnDelay: 4000, enemyCap:7, enemyTypes:['seeker','bomber','patrol','seeker'], hasBoss:true,  bossHp:30 },
  ];
  const TOTAL_LEVELS  = LEVELS.length;
  const VACUUM_RADIUS = 170;
  const DASH_COOLDOWN_MAX = 2.5;

  // ═══════════════════════════════════════════════════════════════════════════
  // LEADERBOARD HELPERS — localStorage, top-5 by score
  // ═══════════════════════════════════════════════════════════════════════════
  function lbLoad() {
    try { return JSON.parse(localStorage.getItem('cosmicCleanup_leaderboard') || '[]'); }
    catch(e) { return []; }
  }
  function lbSave(entries) {
    try { localStorage.setItem('cosmicCleanup_leaderboard', JSON.stringify(entries)); }
    catch(e) {}
  }
  function lbInsert(score, level) {
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const now  = new Date();
    const date = `${now.getDate()} ${months[now.getMonth()]}`;
    const entries = lbLoad();
    const qualifies = entries.length < 5 || score > (entries[entries.length - 1]?.score ?? 0);
    if (qualifies) {
      entries.push({ score, level, date });
      entries.sort((a, b) => b.score - a.score);
      lbSave(entries.slice(0, 5));
    }
    return qualifies;
  }
  function lbBest() {
    const e = lbLoad();
    return e.length ? e[0].score : 0;
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // AUDIO MANAGER — all sound generated via Web Audio API, no external files
  // ═══════════════════════════════════════════════════════════════════════════
  class AudioManager {
    constructor() { this._ctx = null; this._musicNodes = []; this._subBassInterval = null; }

    _getCtx() {
      if (!this._ctx) this._ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this._ctx.state === 'suspended') this._ctx.resume();
      return this._ctx;
    }

    _tone(freq, dur, type = 'sine', gain = 0.25, startOffset = 0) {
      try {
        const ctx = this._getCtx();
        const osc = ctx.createOscillator(), g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime + startOffset);
        g.gain.setValueAtTime(gain, ctx.currentTime + startOffset);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + startOffset + dur);
        osc.start(ctx.currentTime + startOffset);
        osc.stop(ctx.currentTime + startOffset + dur + 0.01);
      } catch(e) {}
    }

    stopMusic() {
      if (this._subBassInterval) { clearInterval(this._subBassInterval); this._subBassInterval = null; }
      this._musicNodes.forEach(n => { try { n.stop(); } catch(e){} });
      this._musicNodes = [];
    }

    playMenuMusic() {
      this.stopMusic();
      try {
        const ctx = this._getCtx();
        [80, 120].forEach((freq, i) => {
          const osc = ctx.createOscillator(), oscGain = ctx.createGain();
          const lfo = ctx.createOscillator(), lfoGain = ctx.createGain();
          osc.type = 'sine'; osc.frequency.value = freq;
          oscGain.gain.value = i === 0 ? 0.07 : 0.05;
          lfo.type = 'sine'; lfo.frequency.value = 0.1;
          lfoGain.gain.value = 0.04;
          lfo.connect(lfoGain); lfoGain.connect(oscGain.gain);
          osc.connect(oscGain); oscGain.connect(ctx.destination);
          osc.start(); lfo.start();
          this._musicNodes.push(osc, lfo);
        });
      } catch(e) {}
    }

    playGameMusic() {
      this.stopMusic();
      try {
        const ctx = this._getCtx();
        [80, 120, 160].forEach((freq, i) => {
          const osc = ctx.createOscillator(), oscGain = ctx.createGain();
          const lfo = ctx.createOscillator(), lfoGain = ctx.createGain();
          osc.type = 'sine'; osc.frequency.value = freq;
          oscGain.gain.value = [0.06, 0.04, 0.03][i];
          lfo.type = 'sine'; lfo.frequency.value = 0.3;
          lfoGain.gain.value = 0.03;
          lfo.connect(lfoGain); lfoGain.connect(oscGain.gain);
          osc.connect(oscGain); oscGain.connect(ctx.destination);
          osc.start(); lfo.start();
          this._musicNodes.push(osc, lfo);
        });
        this._subBassInterval = setInterval(() => {
          try {
            const c = this._getCtx(), o = c.createOscillator(), g = c.createGain();
            o.connect(g); g.connect(c.destination);
            o.type = 'sine'; o.frequency.value = 60;
            g.gain.setValueAtTime(0.12, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.4);
            o.start(); o.stop(c.currentTime + 0.4);
          } catch(e) {}
        }, 2000);
      } catch(e) {}
    }

    playCollectSound()    { this._tone(440, 0.05, 'triangle', 0.2); this._tone(880, 0.10, 'triangle', 0.18, 0.05); }
    playHitSound() {
      try {
        const ctx = this._getCtx(), osc = ctx.createOscillator(), g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.3);
        g.gain.setValueAtTime(0.35, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.start(); osc.stop(ctx.currentTime + 0.31);
      } catch(e) {}
    }
    playPowerUpSound()       { [523, 659, 784].forEach((f, i) => this._tone(f, 0.12, 'sine', 0.25, i * 0.12)); }
    playLevelCompleteSound() { [523, 659, 784, 1047].forEach((f, i) => this._tone(f, 0.15, 'sine', 0.3, i * 0.15)); }
    playRocketBoostSound() {
      try {
        const ctx = this._getCtx(), rate = ctx.sampleRate;
        const buf = ctx.createBuffer(1, rate * 2, rate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        const src = ctx.createBufferSource(); src.buffer = buf;
        const filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 800; filter.Q.value = 0.5;
        const gain = ctx.createGain(), t = ctx.currentTime;
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.6, t + 0.15);
        gain.gain.setValueAtTime(0.6, t + 0.55);
        gain.gain.linearRampToValueAtTime(0.0, t + 1.6);
        src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
        src.start(t); src.stop(t + 1.6);
      } catch(e) {}
    }
    playGameOverSound() {
      try {
        const ctx = this._getCtx(), osc = ctx.createOscillator(), g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.8);
        g.gain.setValueAtTime(0.3, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
        osc.start(); osc.stop(ctx.currentTime + 0.81);
      } catch(e) {}
    }
    playShootSound()   { this._tone(900, 0.04, 'triangle', 0.13); }
    playEnemyDestroySound() {
      try {
        const ctx = this._getCtx(), rate = ctx.sampleRate;
        const buf = ctx.createBuffer(1, Math.floor(rate * 0.3), rate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        const src = ctx.createBufferSource(); src.buffer = buf;
        const filter = ctx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.value = 300; filter.Q.value = 2;
        const gain = ctx.createGain(), t = ctx.currentTime;
        gain.gain.setValueAtTime(0.4, t); gain.gain.linearRampToValueAtTime(0, t + 0.3);
        src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
        src.start(t); src.stop(t + 0.3);
      } catch(e) {}
    }
    playIntroSound() {
      try {
        const ctx = this._getCtx(), osc = ctx.createOscillator(), g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(200, ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(400, ctx.currentTime + 0.4);
        g.gain.setValueAtTime(0.3, ctx.currentTime);
        g.gain.setValueAtTime(0.3, ctx.currentTime + 0.4);
        g.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.6);
        osc.start(); osc.stop(ctx.currentTime + 0.65);
      } catch(e) {}
    }

    // NEW SOUNDS
    playDashSound() {
      try {
        const ctx = this._getCtx(), osc = ctx.createOscillator(), g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(500, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.18);
        g.gain.setValueAtTime(0.28, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
        osc.start(); osc.stop(ctx.currentTime + 0.19);
      } catch(e) {}
    }
    playFreezeSound() { [1047, 1319, 1568, 2093].forEach((f, i) => this._tone(f, 0.14, 'sine', 0.18, i * 0.09)); }
    playEMPSound() {
      try {
        const ctx = this._getCtx(), rate = ctx.sampleRate;
        const buf = ctx.createBuffer(1, Math.floor(rate * 0.35), rate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        const src = ctx.createBufferSource(); src.buffer = buf;
        const filter = ctx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.value = 1400; filter.Q.value = 1.2;
        const g = ctx.createGain(), t = ctx.currentTime;
        g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
        src.connect(filter); filter.connect(g); g.connect(ctx.destination);
        src.start(t); src.stop(t + 0.35);
      } catch(e) {}
    }
    playBossHitSound() {
      try {
        const ctx = this._getCtx(), osc = ctx.createOscillator(), g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.type = 'square';
        osc.frequency.setValueAtTime(90, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.22);
        g.gain.setValueAtTime(0.38, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
        osc.start(); osc.stop(ctx.currentTime + 0.23);
      } catch(e) {}
    }
    playBossDeathSound() {
      try {
        const ctx = this._getCtx(), rate = ctx.sampleRate;
        const buf = ctx.createBuffer(1, Math.floor(rate * 1.0), rate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
        const src = ctx.createBufferSource(); src.buffer = buf;
        const filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 600; filter.Q.value = 0.5;
        const g = ctx.createGain(), t = ctx.currentTime;
        g.gain.setValueAtTime(0.55, t); g.gain.exponentialRampToValueAtTime(0.001, t + 1.0);
        src.connect(filter); filter.connect(g); g.connect(ctx.destination);
        src.start(t); src.stop(t + 1.0);
        const osc = ctx.createOscillator(), g2 = ctx.createGain();
        osc.connect(g2); g2.connect(ctx.destination);
        osc.type = 'sine'; osc.frequency.value = 55;
        g2.gain.setValueAtTime(0.45, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.9);
        osc.start(t); osc.stop(t + 0.91);
      } catch(e) {}
    }
    playBossPhase2Sound() { [180, 270, 360, 540].forEach((f, i) => this._tone(f, 0.22, 'sawtooth', 0.14, i * 0.1)); }
    playEnemyShootSound() { this._tone(280, 0.07, 'square', 0.08); }
    playSpeedSound()      { this._tone(660, 0.06, 'triangle', 0.2); this._tone(990, 0.09, 'triangle', 0.18, 0.06); }
  }
  const AM = new AudioManager();

  // ═══════════════════════════════════════════════════════════════════════════
  // TEXTURE FACTORY — all graphics drawn programmatically, no external files
  // ═══════════════════════════════════════════════════════════════════════════
  function buildTextures(scene) {
    // ── Player Ship (42 × 46) ───────────────────────────────────────────────
    if (!scene.textures.exists('ship')) {
      const g = scene.add.graphics();
      const cx = 21;
      g.fillStyle(0x778899, 1);
      g.fillPoints([{x:cx-8,y:20},{x:cx-17,y:42},{x:cx-8,y:42}], true);
      g.fillPoints([{x:cx+8,y:20},{x:cx+17,y:42},{x:cx+8,y:42}], true);
      g.lineStyle(1.5, 0x334455, 1);
      g.strokePoints([{x:cx-8,y:20},{x:cx-17,y:42},{x:cx-8,y:42}], true);
      g.strokePoints([{x:cx+8,y:20},{x:cx+17,y:42},{x:cx+8,y:42}], true);
      g.fillStyle(0x4a6fa5, 1);
      g.fillPoints([{x:cx,y:4},{x:cx+8,y:16},{x:cx+7,y:42},{x:cx-7,y:42},{x:cx-8,y:16}], true);
      g.fillStyle(0x8ab4f8, 0.75);
      g.fillRect(cx-1, 5, 2, 36);
      g.fillStyle(0x222222, 1);
      g.fillRect(cx-7, 40, 14, 6);
      g.fillStyle(0x000000, 1);
      g.fillCircle(cx-3, 44, 2.5); g.fillCircle(cx+3, 44, 2.5);
      g.fillStyle(0xff6600, 0.35);
      g.fillCircle(cx-3, 44, 1.5); g.fillCircle(cx+3, 44, 1.5);
      g.fillStyle(0x00ffff, 0.95);
      g.fillEllipse(cx, 15, 8, 13);
      g.fillStyle(0xffffff, 0.9);
      g.fillCircle(cx-2, 11, 1.5);
      g.generateTexture('ship', 42, 46);
      g.destroy();
    }

    // ── Debris variants (44 × 44 each) ──────────────────────────────────────
    const debrisColorSets = [
      { outer: 0x555555, inner: 0xaaaaaa }, { outer: 0x4a4a4a, inner: 0x888888 },
      { outer: 0x666666, inner: 0xbbbbbb }, { outer: 0x6B4010, inner: 0x9B6030 },
      { outer: 0x503a20, inner: 0x8a6040 }, { outer: 0x5a5060, inner: 0x9090a0 },
    ];
    for (let v = 0; v < 6; v++) {
      if (scene.textures.exists(`debris_${v}`)) continue;
      const g = scene.add.graphics();
      const cx = 22, cy = 22, r = 17;
      const { outer, inner } = debrisColorSets[v];
      const numPts = 8 + (v % 3);
      const pts = [];
      for (let i = 0; i < numPts; i++) {
        const ang = (i / numPts) * Math.PI * 2;
        const wobble = 0.55 + 0.45 * Math.abs(Math.sin(v * 5.1 + i * 2.4));
        pts.push({ x: cx + r * wobble * Math.cos(ang), y: cy + r * wobble * Math.sin(ang) });
      }
      g.fillStyle(outer, 1); g.fillPoints(pts, true);
      const innerPts = pts.map(p => ({ x: cx + (p.x-cx)*0.45, y: cy + (p.y-cy)*0.45 }));
      g.fillStyle(inner, 0.7); g.fillPoints(innerPts, true);
      g.lineStyle(1, 0x222222, 0.7); g.strokePoints(pts, true);
      g.lineStyle(1, 0x333333, 0.5);
      g.beginPath(); g.moveTo(cx - 4 + v, cy - 6); g.lineTo(cx + 5 - v, cy + 4); g.strokePath();
      g.generateTexture(`debris_${v}`, 44, 44);
      g.destroy();
    }

    // ── Enemy Rogue Satellite / Seeker (46 × 46) ─────────────────────────────
    if (!scene.textures.exists('satellite')) {
      const g = scene.add.graphics();
      const cx = 23, cy = 23, bodyR = 8;
      for (let i = 0; i < 10; i++) {
        const baseAng = (i / 10) * Math.PI * 2;
        const ang = baseAng + Math.sin(i * 1.7) * 0.18;
        const tipR = i % 3 === 0 ? 18 : i % 2 === 0 ? 15 : 12;
        const sideAng1 = ang - 0.22, sideAng2 = ang + 0.22;
        g.fillStyle(0xbb0000, 1);
        g.fillPoints([
          {x: cx + bodyR * Math.cos(sideAng1), y: cy + bodyR * Math.sin(sideAng1)},
          {x: cx + tipR  * Math.cos(ang),      y: cy + tipR  * Math.sin(ang)},
          {x: cx + bodyR * Math.cos(sideAng2), y: cy + bodyR * Math.sin(sideAng2)},
        ], true);
      }
      g.fillStyle(0x880000, 1); g.fillCircle(cx, cy, bodyR);
      g.fillStyle(0xff2200, 0.9); g.fillCircle(cx, cy, 4);
      g.fillStyle(0xff8888, 1); g.fillCircle(cx-1, cy-1, 2);
      g.lineStyle(2, 0xaa1111, 1);
      g.beginPath(); g.moveTo(cx-bodyR-1,cy); g.lineTo(cx-20,cy-4); g.strokePath();
      g.lineStyle(2, 0xff3333, 0.8);
      g.beginPath(); g.moveTo(cx-20,cy-4); g.lineTo(cx-23,cy-1); g.strokePath();
      g.beginPath(); g.moveTo(cx-20,cy-4); g.lineTo(cx-22,cy-8); g.strokePath();
      g.lineStyle(2, 0xaa1111, 1);
      g.beginPath(); g.moveTo(cx+bodyR+1,cy); g.lineTo(cx+20,cy+4); g.strokePath();
      g.lineStyle(2, 0xff3333, 0.8);
      g.beginPath(); g.moveTo(cx+20,cy+4); g.lineTo(cx+23,cy+1); g.strokePath();
      g.beginPath(); g.moveTo(cx+20,cy+4); g.lineTo(cx+22,cy+8); g.strokePath();
      g.generateTexture('satellite', 46, 46);
      g.destroy();
    }

    // ── Bomber enemy (46 × 46) — purple, drops debris ────────────────────────
    if (!scene.textures.exists('bomber')) {
      const g = scene.add.graphics();
      const cx = 23, cy = 23;
      const pts = [];
      for (let i = 0; i < 6; i++) {
        const ang = (i / 6) * Math.PI * 2 - Math.PI / 6;
        pts.push({ x: cx + 13 * Math.cos(ang), y: cy + 13 * Math.sin(ang) });
      }
      g.fillStyle(0x550066, 1); g.fillPoints(pts, true);
      g.fillStyle(0x8800aa, 0.75);
      const innerPts = pts.map(p => ({ x: cx + (p.x - cx) * 0.55, y: cy + (p.y - cy) * 0.55 }));
      g.fillPoints(innerPts, true);
      g.lineStyle(2, 0xcc44ff, 0.9); g.strokePoints(pts, true);
      for (let i = 0; i < 3; i++) {
        const ang = (i / 3) * Math.PI * 2;
        const px = cx + 8 * Math.cos(ang), py = cy + 8 * Math.sin(ang);
        g.fillStyle(0xff6600, 0.9); g.fillCircle(px, py, 3.5);
        g.fillStyle(0xffcc00, 1); g.fillCircle(px, py, 1.8);
      }
      g.fillStyle(0xff44bb, 1); g.fillCircle(cx, cy, 4.5);
      g.fillStyle(0xffffff, 0.8); g.fillCircle(cx - 1.5, cy - 1.5, 2);
      g.generateTexture('bomber', 46, 46);
      g.destroy();
    }

    // ── Patrol enemy (46 × 46) — green, orbits a fixed point ─────────────────
    if (!scene.textures.exists('patrol')) {
      const g = scene.add.graphics();
      const cx = 23, cy = 23;
      const pts = [];
      for (let i = 0; i < 8; i++) {
        const ang = (i / 8) * Math.PI * 2;
        pts.push({ x: cx + 14 * Math.cos(ang), y: cy + 14 * Math.sin(ang) });
      }
      g.fillStyle(0x003322, 1); g.fillPoints(pts, true);
      g.fillStyle(0x00aa44, 0.65);
      const innerPts2 = pts.map(p => ({ x: cx + (p.x - cx) * 0.52, y: cy + (p.y - cy) * 0.52 }));
      g.fillPoints(innerPts2, true);
      g.lineStyle(2, 0x44ffaa, 0.9); g.strokePoints(pts, true);
      g.fillStyle(0x006644, 0.85);
      g.fillRect(cx - 20, cy - 3, 11, 6);
      g.fillRect(cx + 9,  cy - 3, 11, 6);
      g.lineStyle(1, 0x44ffaa, 0.6);
      g.strokeRect(cx - 20, cy - 3, 11, 6);
      g.strokeRect(cx + 9,  cy - 3, 11, 6);
      g.fillStyle(0x00ff88, 1); g.fillCircle(cx, cy, 5.5);
      g.fillStyle(0xaaffcc, 0.9); g.fillCircle(cx - 1.5, cy - 1.5, 2.5);
      g.generateTexture('patrol', 46, 46);
      g.destroy();
    }

    // ── Boss (80 × 80) — large multi-spike monstrosity ────────────────────────
    if (!scene.textures.exists('boss')) {
      const g = scene.add.graphics();
      const cx = 40, cy = 40, bodyR = 16;
      g.fillStyle(0xff0000, 0.12); g.fillCircle(cx, cy, 39);
      for (let i = 0; i < 14; i++) {
        const ang = (i / 14) * Math.PI * 2;
        const tipR = i % 3 === 0 ? 37 : i % 2 === 0 ? 31 : 27;
        const s1 = ang - 0.17, s2 = ang + 0.17;
        g.fillStyle(0xaa0000, 1);
        g.fillPoints([
          { x: cx + bodyR * Math.cos(s1), y: cy + bodyR * Math.sin(s1) },
          { x: cx + tipR  * Math.cos(ang), y: cy + tipR  * Math.sin(ang) },
          { x: cx + bodyR * Math.cos(s2), y: cy + bodyR * Math.sin(s2) },
        ], true);
      }
      for (let i = 0; i < 7; i++) {
        const ang = (i / 7) * Math.PI * 2 + Math.PI / 7;
        g.fillStyle(0xdd2200, 1);
        g.fillPoints([
          { x: cx + 8 * Math.cos(ang - 0.28), y: cy + 8 * Math.sin(ang - 0.28) },
          { x: cx + 20 * Math.cos(ang),        y: cy + 20 * Math.sin(ang) },
          { x: cx + 8 * Math.cos(ang + 0.28), y: cy + 8 * Math.sin(ang + 0.28) },
        ], true);
      }
      g.fillStyle(0x660000, 1); g.fillCircle(cx, cy, bodyR);
      g.fillStyle(0xcc1100, 1); g.fillCircle(cx, cy, 10);
      g.fillStyle(0xff3300, 0.9); g.fillCircle(cx, cy, 6);
      g.fillStyle(0xff8800, 0.85); g.fillCircle(cx, cy, 3);
      g.fillStyle(0xffffff, 0.7); g.fillCircle(cx - 2, cy - 2, 2);
      g.generateTexture('boss', 80, 80);
      g.destroy();
    }

    // ── Shield Power-up (52 × 52) ─────────────────────────────────────────────
    if (!scene.textures.exists('powerup_shield')) {
      const g = scene.add.graphics();
      const cx = 26, cy = 26, r = 21;
      const hexPts = [], glowPts = [];
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2 - Math.PI / 6;
        hexPts.push({ x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) });
        glowPts.push({ x: cx + (r+5)*Math.cos(a), y: cy + (r+5)*Math.sin(a) });
      }
      g.fillStyle(0x0044ff, 0.25); g.fillPoints(glowPts, true);
      g.fillStyle(0x0066ff, 0.92); g.fillPoints(hexPts, true);
      g.lineStyle(2.5, 0x88ccff, 1); g.strokePoints(hexPts, true);
      g.fillStyle(0x44aaff, 0.3);
      g.fillPoints(hexPts.map(p => ({x: cx+(p.x-cx)*0.55, y: cy+(p.y-cy)*0.55})), true);
      g.lineStyle(2, 0xffffff, 1);
      g.strokePoints([{x:cx-9,y:cy-8},{x:cx+9,y:cy-8},{x:cx+11,y:cy+0},{x:cx+7,y:cy+6},{x:cx,y:cy+12},{x:cx-7,y:cy+6},{x:cx-11,y:cy+0}], true);
      g.generateTexture('powerup_shield', 52, 52);
      g.destroy();
    }

    // ── Vacuum Power-up (52 × 52) ─────────────────────────────────────────────
    if (!scene.textures.exists('powerup_vacuum')) {
      const g = scene.add.graphics();
      const cx = 26, cy = 26;
      const pts = [];
      for (let i = 0; i < 16; i++) {
        const ang = (i / 16) * Math.PI * 2 - Math.PI / 2;
        pts.push({ x: cx + (i%2===0?21:9) * Math.cos(ang), y: cy + (i%2===0?21:9) * Math.sin(ang) });
      }
      g.fillStyle(0xffaa00, 0.28); g.fillCircle(cx, cy, 24);
      g.fillStyle(0xffcc00, 1); g.fillPoints(pts, true);
      g.lineStyle(1, 0xffffff, 0.4); g.strokePoints(pts, true);
      g.fillStyle(0xff9900, 1); g.fillCircle(cx, cy, 9);
      g.fillStyle(0xffee66, 1); g.fillCircle(cx, cy, 5);
      g.generateTexture('powerup_vacuum', 52, 52);
      g.destroy();
    }

    // ── Speed Power-up (52 × 52) — green lightning bolt ──────────────────────
    if (!scene.textures.exists('powerup_speed')) {
      const g = scene.add.graphics();
      const cx = 26, cy = 26;
      g.fillStyle(0x00ff44, 0.18); g.fillCircle(cx, cy, 24);
      g.fillStyle(0x00ff88, 1);
      g.fillPoints([
        {x:cx+3,y:7},{x:cx-4,y:23},{x:cx+5,y:23},{x:cx-5,y:45},
        {x:cx+11,y:27},{x:cx+2,y:27},{x:cx+12,y:7}
      ], true);
      g.lineStyle(1.5, 0xaaffcc, 0.8);
      g.strokePoints([
        {x:cx+3,y:7},{x:cx-4,y:23},{x:cx+5,y:23},{x:cx-5,y:45},
        {x:cx+11,y:27},{x:cx+2,y:27},{x:cx+12,y:7}
      ], true);
      g.fillStyle(0xffffff, 0.5); g.fillCircle(cx+4, 12, 2);
      g.generateTexture('powerup_speed', 52, 52);
      g.destroy();
    }

    // ── Freeze Power-up (52 × 52) — ice blue snowflake ───────────────────────
    if (!scene.textures.exists('powerup_freeze')) {
      const g = scene.add.graphics();
      const cx = 26, cy = 26;
      g.fillStyle(0x0088cc, 0.22); g.fillCircle(cx, cy, 24);
      for (let i = 0; i < 6; i++) {
        const ang = (i / 6) * Math.PI * 2;
        g.lineStyle(3, 0x88ddff, 1);
        g.beginPath(); g.moveTo(cx, cy);
        g.lineTo(cx + Math.cos(ang) * 19, cy + Math.sin(ang) * 19);
        g.strokePath();
        for (let b = -1; b <= 1; b += 2) {
          const bAng = ang + b * Math.PI / 3;
          const bx = cx + Math.cos(ang) * 11, by = cy + Math.sin(ang) * 11;
          g.lineStyle(1.5, 0xaaeeff, 0.8);
          g.beginPath(); g.moveTo(bx, by);
          g.lineTo(bx + Math.cos(bAng) * 6, by + Math.sin(bAng) * 6);
          g.strokePath();
        }
      }
      g.fillStyle(0xaaeeff, 1); g.fillCircle(cx, cy, 5.5);
      g.fillStyle(0xffffff, 0.9); g.fillCircle(cx, cy, 2.5);
      g.generateTexture('powerup_freeze', 52, 52);
      g.destroy();
    }

    // ── EMP Power-up (52 × 52) — yellow electric burst ────────────────────────
    if (!scene.textures.exists('powerup_emp')) {
      const g = scene.add.graphics();
      const cx = 26, cy = 26;
      g.fillStyle(0xffff00, 0.18); g.fillCircle(cx, cy, 24);
      for (let i = 0; i < 8; i++) {
        const ang = (i / 8) * Math.PI * 2;
        g.lineStyle(2.5, 0xffdd00, 1);
        g.beginPath();
        g.moveTo(cx + Math.cos(ang) * 8, cy + Math.sin(ang) * 8);
        g.lineTo(cx + Math.cos(ang) * 20, cy + Math.sin(ang) * 20);
        g.strokePath();
      }
      for (let i = 0; i < 8; i++) {
        const ang = (i / 8) * Math.PI * 2 + Math.PI / 8;
        g.lineStyle(1.5, 0xffaa00, 0.7);
        g.beginPath();
        g.moveTo(cx + Math.cos(ang) * 9, cy + Math.sin(ang) * 9);
        g.lineTo(cx + Math.cos(ang) * 16, cy + Math.sin(ang) * 16);
        g.strokePath();
      }
      g.fillStyle(0xffff88, 1); g.fillCircle(cx, cy, 7.5);
      g.fillStyle(0xffffff, 1); g.fillCircle(cx, cy, 3.5);
      g.generateTexture('powerup_emp', 52, 52);
      g.destroy();
    }

    // ── HUD Heart (24 × 22) ───────────────────────────────────────────────────
    if (!scene.textures.exists('heart')) {
      const g = scene.add.graphics();
      g.fillStyle(0xff2244, 1);
      g.fillCircle(7, 7, 6.5); g.fillCircle(17, 7, 6.5);
      g.fillTriangle(1, 9, 23, 9, 12, 22);
      g.fillStyle(0xff88aa, 0.65); g.fillCircle(5, 5, 3);
      g.generateTexture('heart', 24, 22);
      g.destroy();
    }

    // ── Thruster Particle (8 × 8) ─────────────────────────────────────────────
    if (!scene.textures.exists('particle')) {
      const g = scene.add.graphics();
      g.fillStyle(0xff8800, 1); g.fillCircle(4, 4, 4);
      g.generateTexture('particle', 8, 8);
      g.destroy();
    }

    // ── Spawn Warning Arrow (32 × 24) ─────────────────────────────────────────
    if (!scene.textures.exists('spawn_arrow')) {
      const g = scene.add.graphics();
      g.fillStyle(0xff0000, 0.9); g.fillTriangle(16, 0, 32, 24, 0, 24);
      g.lineStyle(1.5, 0xff9999, 0.9); g.strokeTriangle(16, 0, 32, 24, 0, 24);
      g.generateTexture('spawn_arrow', 32, 24);
      g.destroy();
    }

    // ── Player Bullet (12 × 22) — cyan laser bolt ─────────────────────────────
    if (!scene.textures.exists('bullet')) {
      const g = scene.add.graphics();
      g.fillStyle(0x00ffff, 0.9);
      g.fillPoints([{x:6,y:0},{x:10,y:11},{x:6,y:22},{x:2,y:11}], true);
      g.fillStyle(0xffffff, 1); g.fillEllipse(6, 11, 3, 8);
      g.generateTexture('bullet', 12, 22);
      g.destroy();
    }

    // ── Enemy Bullet (10 × 10) — magenta ball ────────────────────────────────
    if (!scene.textures.exists('enemy_bullet')) {
      const g = scene.add.graphics();
      g.fillStyle(0xff00bb, 0.9); g.fillCircle(5, 5, 5);
      g.fillStyle(0xffaaee, 1); g.fillCircle(5, 5, 2.5);
      g.generateTexture('enemy_bullet', 10, 10);
      g.destroy();
    }
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // STARFIELD UTILITY
  // ═══════════════════════════════════════════════════════════════════════════
  function buildStarfield(scene, dynamic = false) {
    const { width, height } = scene.scale;
    const bg = scene.add.graphics();
    const bgColor = scene.game.registry.get('bgColor') || 0x000011;
    bg.fillStyle(bgColor, 1); bg.fillRect(0, 0, width, height);
    const count = dynamic ? 160 : 220;
    if (dynamic) {
      scene.starDots = [];
      for (let i = 0; i < count; i++) {
        const x = Phaser.Math.Between(0, width), y = Phaser.Math.Between(0, height);
        const size = Math.random() < 0.12 ? 2 : 1;
        const alpha = Phaser.Math.FloatBetween(0.25, 1.0);
        const dot = scene.add.rectangle(x, y, size, size, 0xffffff, alpha);
        dot.scrollFactor = 0; dot._speed = Phaser.Math.FloatBetween(0.12, 0.55);
        scene.starDots.push(dot);
      }
    } else {
      const g = scene.add.graphics();
      for (let i = 0; i < count; i++) {
        const x = Phaser.Math.Between(0, width), y = Phaser.Math.Between(0, height);
        const r = Math.random() < 0.1 ? 1.5 : 0.8;
        g.fillStyle(0xffffff, Phaser.Math.FloatBetween(0.3, 1.0));
        g.fillCircle(x, y, r);
      }
    }
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // MENU SCENE
  // ═══════════════════════════════════════════════════════════════════════════
  class MenuScene extends Phaser.Scene {
    constructor() { super({ key: 'MenuScene' }); }

    create() {
      this.game.registry.set('currentLevel', 1);
      this.game.registry.set('score', 0);
      this.game.registry.set('health', 3);
      this.game.registry.set('bgColor', 0x000011);

      buildStarfield(this, true);
      buildTextures(this);

      const { width, height } = this.scale;

      this.add.text(width/2, 76, 'COSMIC CLEANUP', {
        font: 'bold 44px "Courier New"', fill: '#66ddff',
        stroke: '#003366', strokeThickness: 6,
        shadow: { color: '#00aaff', blur: 24, fill: true }
      }).setOrigin(0.5);
      this.add.text(width/2, 122, 'The Space Janitor', { font: '20px "Courier New"', fill: '#aaddff' }).setOrigin(0.5);
      this.add.text(width/2, 188,
        '"A VIP space cruiser is inbound.\nClear Earth\'s orbit across 5 levels\nbefore it docks — or face the consequences."',
        { font: '14px "Courier New"', fill: '#cceecc', align: 'center', lineSpacing: 5 }
      ).setOrigin(0.5);
      this.add.text(width/2, 256,
        'LEVEL 1 — 15 debris / 60s   LEVEL 2 — 18 debris / 55s\n' +
        'LEVEL 3 — 20 debris / 50s   LEVEL 4 — 22 debris / 45s\n' +
        '              LEVEL 5 — 25 debris / 40s  +  BOSS',
        { font: '11px "Courier New"', fill: '#7799bb', align: 'center', lineSpacing: 3 }
      ).setOrigin(0.5);
      this.add.text(width/2, 306, 'SPACE shoot  •  SHIFT dash  •  WASD / Arrows move  •  P pause', {
        font: '11px "Courier New"', fill: '#88aacc'
      }).setOrigin(0.5);

      const btn = this.add.text(width/2, 336, '[ START MISSION ]', {
        font: 'bold 26px "Courier New"', fill: '#ffffff',
        backgroundColor: '#003388', padding: { x:20, y:11 },
        stroke: '#0066ff', strokeThickness: 3
      }).setOrigin(0.5).setInteractive({ useHandCursor: true });
      btn.on('pointerover', () => btn.setStyle({ backgroundColor: '#0055cc' }));
      btn.on('pointerout',  () => btn.setStyle({ backgroundColor: '#003388' }));
      btn.on('pointerdown', () => {
        AM._getCtx(); AM.stopMusic(); AM.playGameMusic();
        this.scene.start('GameScene');
      });
      this.tweens.add({ targets: btn, scaleX:1.05, scaleY:1.05, duration:900, yoyo:true, repeat:-1, ease:'Sine.easeInOut' });

      const spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
      spaceKey.once('down', () => { AM._getCtx(); AM.stopMusic(); AM.playGameMusic(); this.scene.start('GameScene'); });

      // Leaderboard panel
      const lb = lbLoad();
      const panelX = width/2 - 170, panelY = 372, panelW = 340, panelH = 156;
      const panelGfx = this.add.graphics();
      panelGfx.fillStyle(0x000033, 0.80); panelGfx.fillRoundedRect(panelX, panelY, panelW, panelH, 8);
      panelGfx.lineStyle(1, 0x00aaff, 0.7); panelGfx.strokeRoundedRect(panelX, panelY, panelW, panelH, 8);
      this.add.text(width/2, panelY + 14, 'HIGH SCORES', { font: 'bold 12px "Courier New"', fill: '#00ccff' }).setOrigin(0.5);
      const isNewHigh = this.game.registry.get('isNewHighScore');
      const justScore = this.game.registry.get('score') || 0;
      for (let i = 0; i < 5; i++) {
        const entry = lb[i];
        const rowY  = panelY + 32 + i * 23;
        const isNew = isNewHigh && entry && entry.score === justScore;
        this.add.text(panelX + 16, rowY, `#${i+1}`, { font: '13px "Courier New"', fill: '#88aacc' });
        if (entry) {
          this.add.text(panelX + 50, rowY, `${entry.score}`, { font: `bold 13px "Courier New"`, fill: isNew ? '#ffffff' : '#ffd700' });
          this.add.text(panelX + 140, rowY, `Lv ${entry.level}`, { font: '12px "Courier New"', fill: '#88aacc' });
          this.add.text(panelX + 210, rowY, entry.date, { font: '12px "Courier New"', fill: '#667788' });
        } else {
          this.add.text(panelX + 50, rowY, '---', { font: '13px "Courier New"', fill: '#334455' });
        }
      }
      AM.playMenuMusic();
    }

    update() {
      if (this.starDots) {
        const h = this.scale.height;
        this.starDots.forEach(s => { s.y += s._speed; if (s.y > h + 2) s.y = -2; });
      }
    }
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // GAME SCENE
  // ═══════════════════════════════════════════════════════════════════════════
  class GameScene extends Phaser.Scene {
    constructor() { super({ key: 'GameScene' }); }

    init() {
      this._level      = this.game.registry.get('currentLevel') || 1;
      this._score      = this.game.registry.get('score')        || 0;
      this._cfg        = LEVELS[this._level - 1];
      this._health     = this._level === 1 ? 3 : (this.game.registry.get('health') || 3);
      this._collected  = 0;
      this._timeLeft   = this._cfg.timer;
      // Power-ups
      this._shieldActive = false; this._shieldTimer = 0;
      this._vacuumActive = false; this._vacuumTimer = 0;
      this._speedActive  = false; this._speedTimer  = 0;
      this._freezeActive = false; this._freezeTimer = 0;
      // State
      this._hitCooldown  = 0;
      this._paused       = false;
      this._flameTick    = 0;
      this._frameCount   = 0;
      this._gameEnded    = false;
      this._introComplete = false;
      // Combo
      this._comboTimes  = [];
      this._comboActive = false;
      this._comboTimer  = 0;
      // Shooting
      this._fireTimer = 0;
      // Dash
      this._dashCooldown = 0;
      // Boss
      this._bossExtra = null;
      // Touch
      this._joyId     = null;
      this._joyBase   = null;
      this._joyDelta  = { x: 0, y: 0 };
      this._activePointers = new Map();
    }

    preload() { buildTextures(this); }

    create() {
      const { width, height } = this.scale;
      this.game.registry.set('bgColor', this._cfg.bg);

      buildStarfield(this, true);

      this._fxGfx        = this.add.graphics().setDepth(10);
      this._indicatorGfx = this.add.graphics().setDepth(85);
      this._touchGfx     = this.add.graphics().setDepth(195);

      // ── Player ─────────────────────────────────────────────────────────────
      this._player = this.physics.add.image(width/2, height/2, 'ship')
        .setDepth(20).setCollideWorldBounds(false).setDrag(130).setMaxVelocity(290);
      this._player.setSize(34, 40);

      this._thruster = this.add.particles(0, 0, 'particle', {
        lifespan: 200, speed: { min:35, max:80 },
        scale: { start:0.85, end:0 }, alpha: { start:0.8, end:0 },
        tint: [0xff8800, 0xff4400, 0xffdd00], blendMode: 'ADD', emitting: false
      }).setDepth(18);

      // ── Player Bullets ─────────────────────────────────────────────────────
      this._bullets = this.physics.add.group();
      this.physics.world.on('worldbounds', (body) => {
        const go = body.gameObject;
        if (go && go.active && go.texture && (go.texture.key === 'bullet' || go.texture.key === 'enemy_bullet')) go.destroy();
      });

      // ── Enemy Bullets (boss phase 2) ───────────────────────────────────────
      this._enemyBullets = this.physics.add.group();

      // ── Debris ─────────────────────────────────────────────────────────────
      this._debrisGroup = this.physics.add.group();
      this._glintData   = [];
      for (let i = 0; i < this._cfg.debris; i++) {
        this._spawnDebrisPiece(
          Phaser.Math.Between(60, width - 60),
          Phaser.Math.Between(100, height - 60),
          Math.random() < 0.7, i % 6, i % 4 === 0
        );
      }

      // ── Enemy Satellites ───────────────────────────────────────────────────
      this._satGroup  = this.physics.add.group();
      this._satExtras = [];
      for (let i = 0; i < this._cfg.enemies; i++) this._spawnSatellite(i);

      // ── Boss (level 5) ─────────────────────────────────────────────────────
      this._bossGroup = this.physics.add.group();

      // ── Power-ups ──────────────────────────────────────────────────────────
      this._powerupGroup   = this.physics.add.staticGroup();
      this._powerupBobData = [];
      const puPools = [
        ['powerup_shield','powerup_vacuum'],
        ['powerup_shield','powerup_vacuum','powerup_speed'],
        ['powerup_shield','powerup_vacuum','powerup_speed','powerup_freeze'],
        ['powerup_shield','powerup_vacuum','powerup_speed','powerup_freeze','powerup_emp'],
        ['powerup_shield','powerup_vacuum','powerup_speed','powerup_freeze','powerup_emp'],
      ];
      const pool = [...puPools[this._level - 1]].sort(() => Math.random() - 0.5);
      for (let i = 0; i < this._cfg.powerups; i++) this._spawnPowerup(pool[i % pool.length]);
      this._orbitAngle = 0;

      this._shieldFxGfx = this.add.graphics().setDepth(19);

      // ── Physics overlaps / colliders ──────────────────────────────────────
      this.physics.add.overlap(this._player,      this._debrisGroup,   this._collectDebris,          null, this);
      this.physics.add.collider(this._satGroup,   this._debrisGroup,   this._scatterDebris,          null, this);
      this.physics.add.collider(this._player,     this._satGroup,      this._playerHit,              null, this);
      this.physics.add.collider(this._player,     this._bossGroup,     this._playerHitByBoss,        null, this);
      this.physics.add.overlap(this._player,      this._powerupGroup,  this._collectPowerup,         null, this);
      this.physics.add.overlap(this._bullets,     this._satGroup,      this._bulletHitSat,           null, this);
      this.physics.add.overlap(this._bullets,     this._bossGroup,     this._bulletHitBoss,          null, this);
      this.physics.add.overlap(this._player,      this._enemyBullets,  this._playerHitByEnemyBullet, null, this);

      // ── Keyboard Input ─────────────────────────────────────────────────────
      this._cursors  = this.input.keyboard.createCursorKeys();
      this._wasd     = this.input.keyboard.addKeys({
        up: Phaser.Input.Keyboard.KeyCodes.W, down: Phaser.Input.Keyboard.KeyCodes.S,
        left: Phaser.Input.Keyboard.KeyCodes.A, right: Phaser.Input.Keyboard.KeyCodes.D,
      });
      this._keyP     = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.P);
      this._keyESC   = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.ESC);
      this._spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
      this._shiftKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SHIFT);

      // ── Touch / Pointer Input ──────────────────────────────────────────────
      this._FIRE_BTN = { x: width * 0.80, y: height * 0.82, r: 42 };
      this._DASH_BTN = { x: width * 0.93, y: height * 0.68, r: 30 };

      this.input.on('pointerdown', (ptr) => {
        this._activePointers.set(ptr.id, { cx: ptr.x, cy: ptr.y });
        if (ptr.x < width * 0.52) {
          if (this._joyId === null) {
            this._joyId = ptr.id;
            this._joyBase = { x: ptr.x, y: ptr.y };
            this._joyDelta = { x: 0, y: 0 };
          }
        } else {
          const dd = Math.hypot(ptr.x - this._DASH_BTN.x, ptr.y - this._DASH_BTN.y);
          if (dd < this._DASH_BTN.r + 22) this._tryDash();
        }
      });
      this.input.on('pointermove', (ptr) => {
        const data = this._activePointers.get(ptr.id);
        if (data) { data.cx = ptr.x; data.cy = ptr.y; }
        if (ptr.id === this._joyId && this._joyBase) {
          const JR = 65;
          let dx = ptr.x - this._joyBase.x, dy = ptr.y - this._joyBase.y;
          const d = Math.sqrt(dx * dx + dy * dy);
          if (d > JR) { dx *= JR / d; dy *= JR / d; }
          this._joyDelta.x = dx / JR; this._joyDelta.y = dy / JR;
        }
      });
      this.input.on('pointerup', (ptr) => {
        this._activePointers.delete(ptr.id);
        if (ptr.id === this._joyId) {
          this._joyId = null; this._joyBase = null; this._joyDelta = { x: 0, y: 0 };
        }
      });

      // ── HUD ────────────────────────────────────────────────────────────────
      this._buildHUD();

      // ── Pause Overlay (with buttons) ───────────────────────────────────────
      this._buildPauseOverlay();

      // Controls reminder fades out
      this._controlsTxt = this.add.text(10, height - 22,
        'WASD/Arrows move  •  SPACE shoot  •  SHIFT dash  •  P pause', {
        font: '11px "Courier New"', fill: '#6688aa',
        backgroundColor: '#00001188', padding: { x:6, y:3 }
      }).setDepth(90).setAlpha(0.85);
      this.tweens.add({ targets: this._controlsTxt, alpha: 0, delay: 6000, duration: 1200 });

      this._showIntroCard();
    }

    // ── UPDATE ────────────────────────────────────────────────────────────────
    update(time, delta) {
      this._frameCount++;
      const dt = delta / 1000;

      if (this.starDots) {
        this.starDots.forEach(s => { s.y += s._speed; if (s.y > this.scale.height + 2) s.y = -2; });
      }

      if (Phaser.Input.Keyboard.JustDown(this._keyP) || Phaser.Input.Keyboard.JustDown(this._keyESC)) {
        this._paused ? this._resume() : this._pause();
      }
      if (this._paused) return;

      this._fxGfx.clear();
      this._shieldFxGfx.clear();
      this._indicatorGfx.clear();
      this._touchGfx.clear();

      if (this._introComplete) {
        this._handleInput(dt);
      } else {
        this._drawFlame(false);
      }

      this._updateSatellites(dt);
      this._updateBoss(dt, time);
      this._updatePowerupFX(time);
      this._updatePowerupTimers(dt);
      if (this._vacuumActive) { this._applyVacuumMagnet(); this._drawVacuumCircle(); }

      // Player boundary clamping
      const { width, height } = this.scale;
      const bm = 20;
      if (this._player.x < bm)        { this._player.x = bm;        this._player.body.velocity.x = 0; }
      if (this._player.x > width - bm) { this._player.x = width-bm;  this._player.body.velocity.x = 0; }
      if (this._player.y < bm)        { this._player.y = bm;        this._player.body.velocity.y = 0; }
      if (this._player.y > height - bm){ this._player.y = height-bm; this._player.body.velocity.y = 0; }

      this._debrisGroup.getChildren().forEach(d => this.physics.world.wrap(d, 22));
      this._satGroup.getChildren().forEach(s => this.physics.world.wrap(s, 23));

      // Proximity danger ring
      const dangerClose = this._satExtras.some(ext => {
        if (!ext.sprite.active) return false;
        const dx = this._player.x - ext.sprite.x, dy = this._player.y - ext.sprite.y;
        return Math.sqrt(dx*dx + dy*dy) < 180;
      }) || (this._bossExtra && this._bossExtra.sprite.active &&
        Math.hypot(this._player.x - this._bossExtra.sprite.x, this._player.y - this._bossExtra.sprite.y) < 220);
      if (dangerClose) {
        const wa = 0.2 + 0.6 * (0.5 + 0.5 * Math.sin(time * 0.006));
        this._fxGfx.lineStyle(2, 0xff0000, wa);
        this._fxGfx.strokeCircle(this._player.x, this._player.y, 55);
      }

      // Shield FX
      if (this._shieldActive) {
        this._shieldFxGfx.lineStyle(3, 0x44aaff, 0.85);
        this._shieldFxGfx.strokeCircle(this._player.x, this._player.y, 38);
        this._shieldFxGfx.fillStyle(0x0044ff, 0.1);
        this._shieldFxGfx.fillCircle(this._player.x, this._player.y, 38);
      }

      // Freeze overlay on enemies
      if (this._freezeActive) {
        this._satExtras.forEach(ext => {
          if (!ext.sprite.active) return;
          this._fxGfx.fillStyle(0x88ddff, 0.22);
          this._fxGfx.fillCircle(ext.sprite.x, ext.sprite.y, 28);
        });
        if (this._bossExtra && this._bossExtra.sprite.active) {
          this._fxGfx.fillStyle(0x88ddff, 0.28);
          this._fxGfx.fillCircle(this._bossExtra.sprite.x, this._bossExtra.sprite.y, 50);
        }
      }

      // Dash cooldown ring around player
      if (this._dashCooldown > 0) {
        const readyFrac = 1 - this._dashCooldown / DASH_COOLDOWN_MAX;
        this._fxGfx.lineStyle(1.5, 0x444444, 0.35);
        this._fxGfx.strokeCircle(this._player.x, this._player.y, 30);
        this._fxGfx.lineStyle(2, 0xffff44, 0.75);
        this._fxGfx.beginPath();
        this._fxGfx.arc(this._player.x, this._player.y, 30, -Math.PI / 2, -Math.PI / 2 + readyFrac * Math.PI * 2, false, 0.02);
        this._fxGfx.strokePath();
      }

      this._drawDebrisTrails();
      this._drawGlints(time);
      this._drawSatPulses(time);
      this._drawBulletTails();
      this._drawIndicators();
      this._drawTouchUI();

      // Hit cooldown flash
      if (this._hitCooldown > 0) {
        this._hitCooldown -= dt;
        this._player.setAlpha(Math.sin(time * 0.025) > 0 ? 1 : 0.3);
      } else { this._player.setAlpha(1); }

      // Combo timer
      if (this._comboActive) { this._comboTimer -= dt; if (this._comboTimer <= 0) this._comboActive = false; }

      this._updateHUD(time);
    }

    // ── LEVEL INTRO CARD ──────────────────────────────────────────────────────
    _showIntroCard() {
      const { width, height } = this.scale;
      const overlay = this.add.rectangle(width/2, height/2, width, height, 0x000022, 0.85).setDepth(200).setAlpha(0);
      const lvlTxt  = this.add.text(width/2, height/2 - 55, `LEVEL ${this._level}`, {
        font: 'bold 52px "Courier New"', fill: '#00ffff',
        stroke: '#003366', strokeThickness: 5,
        shadow: { color: '#00aaff', blur: 20, fill: true }
      }).setDepth(201).setOrigin(0.5).setAlpha(0);
      const bossWarn = this._cfg.hasBoss ? '  •  BOSS FIGHT!' : '';
      const infoTxt = this.add.text(width/2, height/2 + 14,
        `Collect ${this._cfg.debris} debris  —  ${this._cfg.timer}s  —  ${this._cfg.enemies} enemies${bossWarn}`, {
        font: '19px "Courier New"', fill: '#ffffff'
      }).setDepth(201).setOrigin(0.5).setAlpha(0);
      const ctrlTxt = this.add.text(width/2, height/2 + 56, 'SPACE shoot  •  SHIFT dash  •  WASD/Arrows move', {
        font: '14px "Courier New"', fill: '#888888'
      }).setDepth(201).setOrigin(0.5).setAlpha(0);

      const items = [overlay, lvlTxt, infoTxt, ctrlTxt];
      AM.playIntroSound();

      this.tweens.add({
        targets: items, alpha: 1, duration: 300, ease: 'Linear',
        onComplete: () => {
          this.time.delayedCall(1600, () => {
            this.tweens.add({
              targets: items, alpha: 0, duration: 300, ease: 'Linear',
              onComplete: () => {
                items.forEach(i => i.destroy());
                this._introComplete = true;
                this._startGameTimer();
                if (this._cfg.hasBoss) {
                  this.time.delayedCall(2000, () => this._spawnBoss(), [], this);
                }
              }
            });
          });
        }
      });
    }

    _startGameTimer() {
      this._gameTimer = this.time.addEvent({
        delay: 1000, callback: this._tickTimer,
        callbackScope: this, repeat: this._cfg.timer - 1
      });
    }

    // ── INPUT, SHOOTING & DASH ────────────────────────────────────────────────
    _handleInput(dt) {
      const thrust = 350;
      const up    = this._cursors.up.isDown    || this._wasd.up.isDown;
      const down  = this._cursors.down.isDown  || this._wasd.down.isDown;
      const left  = this._cursors.left.isDown  || this._wasd.left.isDown;
      const right = this._cursors.right.isDown || this._wasd.right.isDown;

      let vx = 0, vy = 0;
      if (up)    vy = -1;
      if (down)  vy =  1;
      if (left)  vx = -1;
      if (right) vx =  1;
      if (vx !== 0 && vy !== 0) { vx *= 0.707; vy *= 0.707; }

      // Touch joystick overrides keyboard
      if (this._joyBase && (Math.abs(this._joyDelta.x) > 0.08 || Math.abs(this._joyDelta.y) > 0.08)) {
        vx = this._joyDelta.x; vy = this._joyDelta.y;
      }

      const moving = vx !== 0 || vy !== 0;
      if (moving) {
        this._player.setAcceleration(vx * thrust, vy * thrust);
        const targetRot = Math.atan2(vy, vx) + Math.PI / 2;
        this._player.setRotation(Phaser.Math.Angle.RotateTo(this._player.rotation, targetRot, 0.13));
        this._thruster.setPosition(
          this._player.x + Math.cos(this._player.rotation + Math.PI) * 8,
          this._player.y + Math.sin(this._player.rotation + Math.PI) * 8
        );
        this._thruster.explode(3);
      } else {
        this._player.setAcceleration(0, 0);
      }

      this._drawFlame(moving);

      // Shooting — spacebar or touch fire zone
      this._fireTimer -= dt;
      const touchFiring = [...this._activePointers.values()].some(p => p.cx >= this.scale.width * 0.52 &&
        Math.hypot(p.cx - this._FIRE_BTN.x, p.cy - this._FIRE_BTN.y) < this._FIRE_BTN.r + 20);
      if ((this._spaceKey.isDown || touchFiring) && this._fireTimer <= 0 && this._bullets.getChildren().length < 6) {
        this._fireProjectile();
        this._fireTimer = 0.35;
      }

      // Dash — shift key
      this._dashCooldown = Math.max(0, this._dashCooldown - dt);
      if (Phaser.Input.Keyboard.JustDown(this._shiftKey)) this._tryDash();
    }

    _tryDash() {
      if (this._dashCooldown > 0 || !this._introComplete || this._gameEnded) return;
      const rot = this._player.rotation;
      const dashPower = 580;
      this._player.setVelocity(
        this._player.body.velocity.x + Math.sin(rot) * dashPower,
        this._player.body.velocity.y - Math.cos(rot) * dashPower
      );
      this._dashCooldown = DASH_COOLDOWN_MAX;
      AM.playDashSound();
      this.cameras.main.shake(70, 0.003);
      this._player.setTint(0xffffff);
      this.time.delayedCall(90, () => { if (this._player.active) this._updatePlayerTint(); });
    }

    _fireProjectile() {
      const rot = this._player.rotation;
      const spawnX = this._player.x + Math.sin(rot) * 22;
      const spawnY = this._player.y - Math.cos(rot) * 22;
      const bullet = this._bullets.create(spawnX, spawnY, 'bullet');
      bullet.setDepth(17).setRotation(rot).setCollideWorldBounds(true);
      bullet.body.onWorldBounds = true;
      bullet.body.setSize(8, 16);
      const speed = 520;
      bullet.setVelocity(Math.sin(rot) * speed, -Math.cos(rot) * speed);
      AM.playShootSound();
    }

    // ── FLAME DRAWING ─────────────────────────────────────────────────────────
    _drawFlame(moving) {
      this._flameTick++;
      const px = this._player.x, py = this._player.y, rot = this._player.rotation;
      const nozzleX = px - Math.sin(rot) * 23, nozzleY = py + Math.cos(rot) * 23;
      const flameDir = rot + Math.PI / 2;
      const perpCos = Math.cos(rot), perpSin = Math.sin(rot);
      const portOff = 3;
      const ports = [
        { x: nozzleX - perpCos * portOff, y: nozzleY - perpSin * portOff },
        { x: nozzleX + perpCos * portOff, y: nozzleY + perpSin * portOff },
      ];
      const isBoost = this._vacuumActive || this._speedActive;
      ports.forEach(port => {
        if (moving) {
          const fh = isBoost ? 48 : 28, wm = isBoost ? 1.3 : 1.0;
          this._drawFlameEllipse(port.x, port.y, flameDir, 5*wm, fh*0.28, 0xff6600, 0.9);
          this._drawFlameEllipse(port.x, port.y, flameDir, 3.5*wm, fh*0.60, 0xffaa00, 0.75);
          this._drawFlameEllipse(port.x, port.y, flameDir, 2.0*wm, fh*0.88, 0xffff00, 0.60);
          if (isBoost) this._drawFlameEllipse(port.x, port.y, flameDir, 1.5, fh, 0x00aaff, 0.50);
        } else {
          const idleH = (this._flameTick % 2 === 0) ? 5 : 7;
          this._drawFlameEllipse(port.x, port.y, flameDir, 2.5, idleH, 0xff6600, 0.40);
        }
      });
    }

    _drawFlameEllipse(nozzleX, nozzleY, flameDir, rx, ry, color, alpha) {
      const cosA = Math.cos(flameDir), sinA = Math.sin(flameDir);
      const cx = nozzleX + cosA * (ry * 0.5), cy = nozzleY + sinA * (ry * 0.5);
      const steps = 10, pts = [];
      for (let i = 0; i < steps; i++) {
        const t = (i / steps) * Math.PI * 2;
        const lx = Math.cos(t) * rx, ly = Math.sin(t) * ry;
        pts.push({ x: cx - sinA * lx + cosA * ly, y: cy + cosA * lx + sinA * ly });
      }
      this._fxGfx.fillStyle(color, alpha);
      this._fxGfx.fillPoints(pts, true);
    }

    _drawBulletTails() {
      this._bullets.getChildren().forEach(b => {
        if (!b.active) return;
        const rot = b.rotation;
        for (let i = 0; i < 3; i++) {
          const dist = (i + 1) * 5, alpha = 0.5 - i * 0.15;
          const tx = b.x - Math.sin(rot) * dist, ty = b.y + Math.cos(rot) * dist;
          this._fxGfx.fillStyle(0x00ffff, alpha);
          this._fxGfx.fillCircle(tx, ty, 2);
        }
      });
    }

    // ── DEBRIS PARTICLE TRAILS ────────────────────────────────────────────────
    _drawDebrisTrails() {
      this._debrisGroup.getChildren().forEach(d => {
        if (!d.active || !d.body) return;
        const vx = d.body.velocity.x, vy = d.body.velocity.y;
        const speed = Math.sqrt(vx*vx + vy*vy);
        if (speed < 12) return;
        const nx = -vx / speed, ny = -vy / speed;
        for (let i = 1; i <= 4; i++) {
          const alpha = 0.35 - i * 0.07;
          const radius = 2.8 - i * 0.5;
          if (radius <= 0) break;
          this._fxGfx.fillStyle(0xaaaaaa, alpha);
          this._fxGfx.fillCircle(d.x + nx * i * 5, d.y + ny * i * 5, radius);
        }
      });
    }

    // ── BULLET → SATELLITE HIT ────────────────────────────────────────────────
    _bulletHitSat(bullet, satellite) {
      if (!bullet.active || !satellite.active) return;
      bullet.destroy();
      const ext = this._satExtras.find(e => e.sprite === satellite);
      if (!ext) return;
      ext.hp--;
      AM.playHitSound();
      satellite.setTint(0xffffff);
      this.time.delayedCall(33, () => { if (satellite.active) satellite.clearTint(); });
      if (ext.hp <= 0) {
        this._spawnExplosion(satellite.x, satellite.y, 10);
        AM.playEnemyDestroySound();
        this._score += 50;
        const pop = this.add.text(satellite.x, satellite.y - 20, '+50', {
          font: 'bold 20px "Courier New"', fill: '#ffdd44',
          shadow: { offsetX:2, offsetY:2, color:'#000000', fill:true }
        }).setDepth(50).setOrigin(0.5);
        this.tweens.add({ targets: pop, y: pop.y - 40, alpha: 0, duration: 800, onComplete: () => pop.destroy() });
        this.cameras.main.shake(100, 0.004);
        this._satExtras = this._satExtras.filter(e => e.sprite !== satellite);
        satellite.destroy();
        const activeCount = this._satExtras.filter(e => e.sprite.active).length;
        if (activeCount < this._cfg.enemyCap) {
          this.time.delayedCall(this._cfg.respawnDelay, this._respawnEnemy, [], this);
        }
      }
    }

    // ── BULLET → BOSS HIT ─────────────────────────────────────────────────────
    _bulletHitBoss(bullet, bossSprite) {
      if (!bullet.active || !bossSprite.active) return;
      bullet.destroy();
      if (!this._bossExtra) return;

      this._bossExtra.hp--;
      AM.playBossHitSound();
      this.cameras.main.shake(90, 0.004);

      bossSprite.setTint(0xffffff);
      this.time.delayedCall(45, () => { if (bossSprite.active) bossSprite.clearTint(); });

      this._score += 10;
      const pop = this.add.text(bossSprite.x, bossSprite.y - 30, '+10', {
        font: 'bold 16px "Courier New"', fill: '#ff8888'
      }).setDepth(50).setOrigin(0.5);
      this.tweens.add({ targets: pop, y: pop.y - 28, alpha: 0, duration: 600, onComplete: () => pop.destroy() });

      // Phase 2 trigger at 50% HP
      if (this._bossExtra.phase === 1 && this._bossExtra.hp <= this._bossExtra.maxHp / 2) {
        this._bossExtra.phase = 2;
        this._bossExtra.fireTimer = 1.2;
        AM.playBossPhase2Sound();
        this.cameras.main.shake(250, 0.012);
        const txt = this.add.text(this.scale.width/2, 85, '⚡ BOSS ENRAGED!', {
          font: 'bold 24px "Courier New"', fill: '#ff4400',
          stroke: '#000000', strokeThickness: 3
        }).setDepth(205).setOrigin(0.5).setAlpha(0);
        this.tweens.add({ targets: txt, alpha: 1, duration: 200, hold: 1400, yoyo: true, onComplete: () => txt.destroy() });
      }

      if (this._bossExtra.hp <= 0) this._killBoss();
    }

    _killBoss() {
      const { sprite } = this._bossExtra;
      const bx = sprite.x, by = sprite.y;

      this._spawnExplosion(bx, by, 30);
      const flash = this.add.rectangle(this.scale.width/2, this.scale.height/2, this.scale.width, this.scale.height, 0xffffff, 0.65).setDepth(300);
      this.tweens.add({ targets: flash, alpha: 0, duration: 400, onComplete: () => flash.destroy() });

      this.cameras.main.shake(420, 0.018);
      AM.playBossDeathSound();

      this._score += 500;
      const pop = this.add.text(bx, by - 50, '+500  BOSS DESTROYED!', {
        font: 'bold 28px "Courier New"', fill: '#ffdd44',
        stroke: '#000000', strokeThickness: 4,
        shadow: { offsetX:2, offsetY:2, color:'#000000', fill:true }
      }).setDepth(70).setOrigin(0.5);
      this.tweens.add({ targets: pop, y: pop.y - 75, alpha: 0, duration: 1600, onComplete: () => pop.destroy() });

      sprite.destroy();
      this._bossExtra = null;
      // Update HP bar immediately
      if (this._bossHpBarFg) { this._bossHpBarFg.clear(); this._bossHpBarFg.setAlpha(0); }
      if (this._bossHpBarBg) this._bossHpBarBg.setAlpha(0);
      if (this._bossHpLbl)   this._bossHpLbl.setAlpha(0);
    }

    _spawnExplosion(x, y, count = 10) {
      const colors = [0xff4400, 0xff8800, 0xffcc00, 0xff0000, 0xffffff];
      for (let i = 0; i < count; i++) {
        const color = colors[Math.floor(Math.random() * colors.length)];
        const r = 3 + Math.random() * (count > 10 ? 5 : 2);
        const ang = Math.random() * Math.PI * 2;
        const speed = 60 + Math.random() * (count > 10 ? 180 : 100);
        const dot = this.add.circle(x, y, r, color).setDepth(30);
        this.tweens.add({
          targets: dot, x: x + Math.cos(ang)*speed*0.8, y: y + Math.sin(ang)*speed*0.8,
          alpha: 0, scaleX: 0, scaleY: 0, duration: count > 10 ? 900 : 600, ease: 'Power2.easeOut',
          onComplete: () => dot.destroy()
        });
      }
    }

    // ── ENEMY RESPAWNING ──────────────────────────────────────────────────────
    _respawnEnemy() {
      if (this._gameEnded) return;
      const activeCount = this._satExtras.filter(e => e.sprite.active).length;
      if (activeCount >= this._cfg.enemyCap) return;

      const { width, height } = this.scale;
      const margin = 30, edge = Math.floor(Math.random() * 4);
      let sx, sy;
      switch (edge) {
        case 0: sx = Phaser.Math.Between(0, width); sy = -margin; break;
        case 1: sx = width + margin; sy = Phaser.Math.Between(50, height); break;
        case 2: sx = Phaser.Math.Between(0, width); sy = height + margin; break;
        default: sx = -margin; sy = Phaser.Math.Between(50, height); break;
      }
      const typePool = this._cfg.enemyTypes;
      const type = typePool[Math.floor(Math.random() * typePool.length)];
      this._spawnSatelliteAt(sx, sy, type);
      this._showSpawnWarning(sx, sy);
    }

    // ── SATELLITE SPAWNING ────────────────────────────────────────────────────
    _spawnSatellite(index) {
      const { width, height } = this.scale;
      const corners = [[60,60],[width-60,60],[60,height-60],[width-60,height-60],[width/2,50]];
      const [sx, sy] = corners[index % corners.length];
      const type = this._cfg.enemyTypes[index % this._cfg.enemyTypes.length];
      this._spawnSatelliteAt(sx, sy, type, index);
    }

    _spawnSatelliteAt(x, y, type = 'seeker', index = 0) {
      const textureKey = type === 'bomber' ? 'bomber' : type === 'patrol' ? 'patrol' : 'satellite';
      const sat = this._satGroup.create(x, y, textureKey)
        .setBounce(0.55).setCollideWorldBounds(false)
        .setMaxVelocity(this._cfg.enemySpeed * 1.3)
        .setAngularVelocity(Phaser.Math.Between(40, 90))
        .setDepth(16);
      sat.setSize(40, 40);

      const ext = {
        sprite: sat, type,
        pulsePhase: Phaser.Math.FloatBetween(0, Math.PI * 2),
        flickerCount: 0,
        hp: this._cfg.enemyHp,
      };

      if (type === 'patrol') {
        const { width, height } = this.scale;
        ext.patrolCx = Phaser.Math.Clamp(x + Phaser.Math.Between(-120, 120), 80, width - 80);
        ext.patrolCy = Phaser.Math.Clamp(y + Phaser.Math.Between(-80, 80), 80, height - 80);
        ext.patrolAngle = Phaser.Math.FloatBetween(0, Math.PI * 2);
        ext.patrolRadius = Phaser.Math.Between(65, 130);
      }
      if (type === 'bomber') {
        ext.bomberTimer = Phaser.Math.FloatBetween(3.5, 6.5);
      }

      this._satExtras.push(ext);
      if (this._level >= 2 && index === 0) this._showSpawnWarning(x, y);
    }

    // ── BOSS ──────────────────────────────────────────────────────────────────
    _spawnBoss() {
      if (this._gameEnded) return;
      const { width, height } = this.scale;
      const boss = this._bossGroup.create(width / 2, height / 2, 'boss')
        .setDepth(17).setMaxVelocity(120).setCollideWorldBounds(true);
      boss.setSize(62, 62);

      this._bossExtra = { sprite: boss, hp: this._cfg.bossHp, maxHp: this._cfg.bossHp, phase: 1, fireTimer: 3.0, stunTimer: 0 };

      boss.setScale(0.1);
      this.tweens.add({ targets: boss, scaleX: 1, scaleY: 1, duration: 650, ease: 'Back.easeOut' });

      const txt = this.add.text(width/2, height/2 - 80, '⚠ BOSS APPEARS!', {
        font: 'bold 34px "Courier New"', fill: '#ff0000',
        stroke: '#440000', strokeThickness: 4,
        shadow: { color: '#ff0000', blur: 22, fill: true }
      }).setDepth(205).setOrigin(0.5).setAlpha(0);
      this.tweens.add({ targets: txt, alpha: 1, duration: 300, hold: 1100, yoyo: true, onComplete: () => txt.destroy() });

      this.cameras.main.shake(300, 0.012);
      AM.playBossPhase2Sound();

      // Show HP bar
      if (this._bossHpBarBg) this._bossHpBarBg.setAlpha(1);
      if (this._bossHpLbl)   this._bossHpLbl.setAlpha(1);
    }

    _updateBoss(dt, time) {
      if (!this._bossExtra || !this._bossExtra.sprite.active) return;
      if (!this._introComplete) return;

      const { sprite, phase } = this._bossExtra;

      // Stun
      if (this._bossExtra.stunTimer > 0) {
        this._bossExtra.stunTimer -= dt;
        sprite.setVelocity(0, 0);
        return;
      }
      if (this._freezeActive) return;

      const speed = phase === 1 ? 72 : 115;
      const dx = this._player.x - sprite.x, dy = this._player.y - sprite.y;
      const d  = Math.sqrt(dx*dx + dy*dy) || 1;
      sprite.setVelocity((dx/d)*speed, (dy/d)*speed);
      sprite.setAngularVelocity(45);

      // Phase 2: fire at player
      if (phase === 2) {
        this._bossExtra.fireTimer -= dt;
        if (this._bossExtra.fireTimer <= 0) {
          this._bossFire();
          this._bossExtra.fireTimer = 2.4;
        }
      }

      // Boss glow
      const bp = 0.5 + 0.5 * Math.sin(time * 0.005);
      this._fxGfx.lineStyle(3, phase === 2 ? 0xff4400 : 0xff0000, bp * 0.45);
      this._fxGfx.strokeCircle(sprite.x, sprite.y, 52);
      this._fxGfx.fillStyle(phase === 2 ? 0xff2200 : 0xff0000, 0.07);
      this._fxGfx.fillCircle(sprite.x, sprite.y, 52);
    }

    _bossFire() {
      if (this._gameEnded || !this._bossExtra) return;
      const { sprite } = this._bossExtra;
      const dx = this._player.x - sprite.x, dy = this._player.y - sprite.y;
      const d  = Math.sqrt(dx*dx + dy*dy) || 1;
      const speed = 190;
      const bolt = this._enemyBullets.create(sprite.x, sprite.y, 'enemy_bullet');
      bolt.setDepth(17).setCollideWorldBounds(true);
      bolt.body.onWorldBounds = true;
      bolt.setVelocity((dx/d)*speed, (dy/d)*speed);
      AM.playEnemyShootSound();
      this.time.delayedCall(4500, () => { if (bolt.active) bolt.destroy(); });
    }

    // ── SATELLITE AI ──────────────────────────────────────────────────────────
    _updateSatellites(dt) {
      if (!this._introComplete) return;
      const speed = this._cfg.enemySpeed;
      const frozenFactor = this._freezeActive ? 0.08 : 1.0;

      this._satExtras.forEach(ext => {
        if (!ext.sprite.active) return;
        const { sprite, type } = ext;

        if (type === 'patrol') {
          ext.patrolAngle += dt * 1.15 * frozenFactor;
          const { width, height } = this.scale;
          ext.patrolCx = Phaser.Math.Clamp(ext.patrolCx, 60, width - 60);
          ext.patrolCy = Phaser.Math.Clamp(ext.patrolCy, 60, height - 60);
          const targetX = ext.patrolCx + Math.cos(ext.patrolAngle) * ext.patrolRadius;
          const targetY = ext.patrolCy + Math.sin(ext.patrolAngle) * ext.patrolRadius;
          const dx = targetX - sprite.x, dy = targetY - sprite.y;
          const d = Math.sqrt(dx*dx + dy*dy) || 1;
          sprite.setVelocity((dx/d)*speed*0.78*frozenFactor, (dy/d)*speed*0.78*frozenFactor);
        } else if (type === 'bomber') {
          const dx = this._player.x - sprite.x, dy = this._player.y - sprite.y;
          const d = Math.sqrt(dx*dx + dy*dy) || 1;
          sprite.setVelocity((dx/d)*speed*0.60*frozenFactor, (dy/d)*speed*0.60*frozenFactor);
          if (ext.bomberTimer !== undefined && !this._freezeActive) {
            ext.bomberTimer -= dt;
            if (ext.bomberTimer <= 0) {
              this._dropBomb(sprite.x, sprite.y);
              ext.bomberTimer = Phaser.Math.FloatBetween(4.0, 7.0);
            }
          }
        } else {
          const dx = this._player.x - sprite.x, dy = this._player.y - sprite.y;
          const d = Math.sqrt(dx*dx + dy*dy) || 1;
          sprite.setVelocity((dx/d)*speed*frozenFactor, (dy/d)*speed*frozenFactor);
        }
      });
    }

    _dropBomb(x, y) {
      if (this._gameEnded) return;
      const variant = Math.floor(Math.random() * 6);
      this._spawnDebrisPiece(x, y, false, variant, false);
      // Brief orange flash at drop point
      this._fxGfx.fillStyle(0xff6600, 0.6);
      this._fxGfx.fillCircle(x, y, 14);
    }

    _drawSatPulses(time) {
      this._satExtras.forEach(ext => {
        if (!ext.sprite.active) return;
        const { sprite, pulsePhase, type } = ext;
        const dx = this._player.x - sprite.x, dy = this._player.y - sprite.y;
        const dist2 = Math.sqrt(dx*dx + dy*dy);
        const near  = dist2 < 300;
        const speed2 = near ? 3.5 : 1.8;
        const pulse  = 0.8 + 0.55 * Math.sin(time * 0.001 * speed2 + pulsePhase);
        const alpha  = near ? 0.55 : 0.3;
        const baseColor = type === 'bomber' ? (near ? 0xff44cc : 0xaa22aa) :
                          type === 'patrol' ? (near ? 0x44ff88 : 0x22aa55) :
                          (near ? 0xff0000 : 0xcc0000);
        this._fxGfx.fillStyle(baseColor, alpha);
        this._fxGfx.fillCircle(sprite.x, sprite.y, 28 * pulse);
        ext.flickerCount++;
        if      (ext.flickerCount % 20 === 0)  sprite.setTint(near ? 0xffaaff : 0xff88ff);
        else if (ext.flickerCount % 20 === 10) sprite.clearTint();
      });
    }

    // ── OFF-SCREEN ENEMY INDICATORS ───────────────────────────────────────────
    _drawIndicators() {
      const { width, height } = this.scale;
      const HUD_H = 50;
      const candidates = [];

      const allEnemySprites = [
        ...this._satExtras.map(e => e.sprite),
        ...(this._bossExtra && this._bossExtra.sprite.active ? [this._bossExtra.sprite] : [])
      ];

      allEnemySprites.forEach(sprite => {
        if (!sprite.active) return;
        const sx = sprite.x, sy = sprite.y;
        const offscreen = sx < 0 || sx > width || sy < HUD_H || sy > height;
        const nearEdge  = !offscreen && (sx < 40 || sx > width - 40 || sy < HUD_H + 40 || sy > height - 40);
        if (!offscreen && !nearEdge) return;
        const dL = sx, dR = width - sx, dT = sy - HUD_H, dB = height - sy;
        const minD = Math.min(dL, dR, dT, dB);
        let ex, ey, arrowRot;
        if      (minD === dL) { ex = 16;       ey = Phaser.Math.Clamp(sy, HUD_H+14, height-14); arrowRot = Math.PI/2; }
        else if (minD === dR) { ex = width-16; ey = Phaser.Math.Clamp(sy, HUD_H+14, height-14); arrowRot = -Math.PI/2; }
        else if (minD === dT) { ex = Phaser.Math.Clamp(sx, 14, width-14); ey = HUD_H+16; arrowRot = 0; }
        else                  { ex = Phaser.Math.Clamp(sx, 14, width-14); ey = height-16; arrowRot = Math.PI; }
        candidates.push({ ex, ey, arrowRot });
      });

      const drawn = [];
      candidates.forEach(c => {
        const clash = drawn.some(d =>
          Math.abs(c.arrowRot - d.arrowRot) < 0.01 && Math.hypot(c.ex - d.ex, c.ey - d.ey) < 30
        );
        if (!clash) drawn.push(c);
      });

      drawn.forEach(({ ex, ey, arrowRot }) => {
        const cos = Math.cos(arrowRot), sin = Math.sin(arrowRot);
        const tp = (lx, ly) => ({ x: ex + lx*cos - ly*sin, y: ey + lx*sin + ly*cos });
        const p0 = tp(0, 7), p1 = tp(-5, -7), p2 = tp(5, -7);
        this._indicatorGfx.fillStyle(0xff2200, 0.9);
        this._indicatorGfx.fillPoints([p0, p1, p2], true);
        this._indicatorGfx.lineStyle(1, 0xffffff, 0.8);
        this._indicatorGfx.strokePoints([p0, p1, p2], true);
      });
    }

    // ── TOUCH UI ──────────────────────────────────────────────────────────────
    _drawTouchUI() {
      const g = this._touchGfx;
      const { x: fx, y: fy, r: fr } = this._FIRE_BTN;
      const { x: dx, y: dy, r: dr } = this._DASH_BTN;

      // Fire button
      const fireHeld = [...this._activePointers.values()].some(p =>
        p.cx >= this.scale.width * 0.52 && Math.hypot(p.cx - fx, p.cy - fy) < fr + 20);
      g.fillStyle(0x00ffff, fireHeld ? 0.35 : 0.10);
      g.fillCircle(fx, fy, fr);
      g.lineStyle(2, 0x00ffff, fireHeld ? 0.85 : 0.40);
      g.strokeCircle(fx, fy, fr);
      // Bullet icon inside fire button
      g.fillStyle(0x00ffff, fireHeld ? 0.9 : 0.4);
      g.fillTriangle(fx, fy - 14, fx - 6, fy + 8, fx + 6, fy + 8);
      g.fillStyle(0xffffff, fireHeld ? 0.9 : 0.35);
      g.fillRect(fx - 2, fy - 6, 4, 10);

      // Dash button with cooldown arc
      const dashReady = this._dashCooldown <= 0;
      const dashCol = dashReady ? 0xffff00 : 0x666600;
      g.fillStyle(dashCol, dashReady ? 0.15 : 0.08);
      g.fillCircle(dx, dy, dr);
      g.lineStyle(2, dashCol, dashReady ? 0.7 : 0.35);
      g.strokeCircle(dx, dy, dr);
      if (!dashReady) {
        const readyFrac = 1 - this._dashCooldown / DASH_COOLDOWN_MAX;
        g.lineStyle(2.5, 0xffff44, 0.8);
        g.beginPath();
        g.arc(dx, dy, dr, -Math.PI / 2, -Math.PI / 2 + readyFrac * Math.PI * 2, false, 0.02);
        g.strokePath();
      }
      // Lightning bolt icon
      g.fillStyle(dashCol, dashReady ? 0.8 : 0.3);
      g.fillPoints([
        {x:dx+2,y:dy-11},{x:dx-3,y:dy-1},{x:dx+2,y:dy-1},{x:dx-4,y:dy+11},
        {x:dx+5,y:dy+2}, {x:dx+1,y:dy+2},{x:dx+8,y:dy-11}
      ], true);

      // Joystick
      if (this._joyBase) {
        const JR = 65, stickR = 22;
        g.fillStyle(0xffffff, 0.08);
        g.fillCircle(this._joyBase.x, this._joyBase.y, JR);
        g.lineStyle(1.5, 0xffffff, 0.25);
        g.strokeCircle(this._joyBase.x, this._joyBase.y, JR);
        const sx = this._joyBase.x + this._joyDelta.x * JR;
        const sy = this._joyBase.y + this._joyDelta.y * JR;
        g.fillStyle(0xffffff, 0.30);
        g.fillCircle(sx, sy, stickR);
        g.lineStyle(1.5, 0xffffff, 0.45);
        g.strokeCircle(sx, sy, stickR);
      } else {
        // Hint ring
        g.fillStyle(0xffffff, 0.04);
        g.fillCircle(this.scale.width * 0.18, this.scale.height * 0.78, 52);
        g.lineStyle(1, 0xffffff, 0.12);
        g.strokeCircle(this.scale.width * 0.18, this.scale.height * 0.78, 52);
      }
    }

    // ── DEBRIS ────────────────────────────────────────────────────────────────
    _spawnDebrisPiece(x, y, isLarge, variant, addGlint = false) {
      const piece = this._debrisGroup.create(x, y, `debris_${variant}`);
      piece.setBounce(0.8).setCollideWorldBounds(false).setDepth(15);
      piece._isLarge = isLarge; piece._pts = isLarge ? 10 : 5; piece._variant = variant;
      if (!isLarge) piece.setScale(0.6);
      const spd = Phaser.Math.Between(18, 62);
      const ang = Phaser.Math.FloatBetween(0, Math.PI * 2);
      piece.setVelocity(Math.cos(ang)*spd, Math.sin(ang)*spd);
      piece.setAngularVelocity(Phaser.Math.Between(-50, 50));
      if (addGlint) this._glintData.push({ sprite: piece, phase: Phaser.Math.FloatBetween(0, Math.PI*2) });
      return piece;
    }

    _drawGlints(time) {
      this._glintData = this._glintData.filter(g => g.sprite.active);
      this._glintData.forEach(({ sprite, phase }) => {
        const alpha = 0.5 + 0.5 * Math.sin(time * 0.003 + phase);
        this._fxGfx.fillStyle(0xffffff, alpha * 0.9);
        this._fxGfx.fillCircle(sprite.x, sprite.y - 4, 2.5);
      });
    }

    // ── POWER-UPS ─────────────────────────────────────────────────────────────
    _spawnPowerup(type) {
      const { width, height } = this.scale;
      const x = Phaser.Math.Between(60, width - 60), y = Phaser.Math.Between(80, height - 80);
      const pu = this._powerupGroup.create(x, y, type).setDepth(14);
      this._powerupBobData.push({ sprite: pu, baseY: y, type });
    }

    _updatePowerupFX(time) {
      this._orbitAngle += 0.04;
      this._powerupBobData = this._powerupBobData.filter(d => d.sprite.active);
      this._powerupBobData.forEach(d => {
        d.sprite.y = d.baseY + Math.sin(time * 0.002) * 7;
        d.sprite.refreshBody();
        if ((d.type === 'powerup_vacuum' || d.type === 'powerup_emp') && d.sprite.active) {
          for (let i = 0; i < 4; i++) {
            const ang = this._orbitAngle + (i / 4) * Math.PI * 2;
            const ox = d.sprite.x + Math.cos(ang) * 22, oy = d.sprite.y + Math.sin(ang) * 22;
            this._fxGfx.fillStyle(d.type === 'powerup_emp' ? 0xffff44 : 0xffffff, 0.75);
            this._fxGfx.fillCircle(ox, oy, 2.5);
          }
        }
      });
    }

    _drawVacuumCircle() {
      const { x, y } = this._player, dashes = 26;
      this._fxGfx.lineStyle(1.5, 0xffcc00, 0.45);
      for (let i = 0; i < dashes; i++) {
        const a1 = (i / dashes) * Math.PI * 2, a2 = a1 + (Math.PI * 2 / dashes) * 0.55;
        this._fxGfx.beginPath();
        this._fxGfx.arc(x, y, VACUUM_RADIUS, a1, a2, false, 0.05);
        this._fxGfx.strokePath();
      }
    }

    _updatePowerupTimers(dt) {
      if (this._shieldActive) {
        this._shieldTimer -= dt;
        if (this._shieldTimer <= 0) { this._shieldActive = false; this._updatePlayerTint(); }
      }
      if (this._vacuumActive) {
        this._vacuumTimer -= dt;
        if (this._vacuumTimer <= 0) { this._vacuumActive = false; this._updatePlayerTint(); }
      }
      if (this._speedActive) {
        this._speedTimer -= dt;
        if (this._speedTimer <= 0) {
          this._speedActive = false;
          this._player.setMaxVelocity(290);
          this._updatePlayerTint();
        }
      }
      if (this._freezeActive) {
        this._freezeTimer -= dt;
        if (this._freezeTimer <= 0) { this._freezeActive = false; }
      }
    }

    _applyVacuumMagnet() {
      const pull = 210;
      this._debrisGroup.getChildren().forEach(d => {
        const dx = this._player.x - d.x, dy = this._player.y - d.y;
        const dist = Math.sqrt(dx*dx + dy*dy) || 1;
        if (dist < VACUUM_RADIUS) d.setVelocity(d.body.velocity.x + (dx/dist)*pull*0.06, d.body.velocity.y + (dy/dist)*pull*0.06);
      });
    }

    _applyEMP() {
      // Push all enemies outward
      const pushForce = 420;
      this._satExtras.forEach(ext => {
        if (!ext.sprite.active) return;
        const dx = ext.sprite.x - this._player.x, dy = ext.sprite.y - this._player.y;
        const d = Math.sqrt(dx*dx + dy*dy) || 1;
        ext.sprite.setVelocity((dx/d)*pushForce, (dy/d)*pushForce);
      });
      if (this._bossExtra && this._bossExtra.sprite.active) {
        const dx = this._bossExtra.sprite.x - this._player.x;
        const dy = this._bossExtra.sprite.y - this._player.y;
        const d  = Math.sqrt(dx*dx + dy*dy) || 1;
        this._bossExtra.sprite.setVelocity((dx/d)*200, (dy/d)*200);
        this._bossExtra.stunTimer = 2.2;
      }
      // Shockwave ring
      const ring = this.add.circle(this._player.x, this._player.y, 18, 0xffff00, 0.5).setDepth(45);
      this.tweens.add({
        targets: ring, scaleX: 9, scaleY: 9, alpha: 0,
        duration: 380, ease: 'Power2.easeOut', onComplete: () => ring.destroy()
      });
      this.cameras.main.shake(280, 0.012);
    }

    _updatePlayerTint() {
      if (this._shieldActive) this._player.setTint(0x44aaff);
      else if (this._speedActive) this._player.setTint(0x00ff88);
      else if (this._vacuumActive) this._player.setTint(0xffcc00);
      else this._player.clearTint();
    }

    // ── COLLISION CALLBACKS ───────────────────────────────────────────────────
    _collectDebris(player, piece) {
      piece.destroy();
      this._glintData = this._glintData.filter(g => g.sprite !== piece);
      const pts = (this._comboActive ? 2 : 1) * (piece._pts || 10);
      this._score += pts;
      this._collected++;
      AM.playCollectSound();
      const popTxt = this._comboActive ? `+${pts} x2!` : `+${pts}`;
      const pop = this.add.text(piece.x, piece.y - 18, popTxt, {
        font: 'bold 20px "Courier New"', fill: this._comboActive ? '#ffdd00' : '#ffff44',
        shadow: { offsetX:2, offsetY:2, color:'#000000', fill:true }
      }).setDepth(50).setOrigin(0.5);
      this.tweens.add({ targets: pop, y: pop.y - 40, alpha: 0, duration: 800, onComplete: () => pop.destroy() });
      const now = this.time.now;
      this._comboTimes.push(now);
      this._comboTimes = this._comboTimes.filter(t => now - t < 4000);
