<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cosmic Cleanup: The Space Janitor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    canvas { display: block; box-shadow: 0 0 60px #0044aa66; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.88.2/dist/phaser.min.js"></script>
  <script>
  'use strict';

  // ═══════════════════════════════════════════════════════════════════════════
  // LEVEL CONFIGURATION TABLE
  // ═══════════════════════════════════════════════════════════════════════════
  const LEVELS = [
    { debris: 15, timer: 60, enemies: 2, enemySpeed: 60,  powerups: 2, bg: 0x0a0a2e },
    { debris: 18, timer: 55, enemies: 3, enemySpeed: 80,  powerups: 2, bg: 0x0d0a2e },
    { debris: 20, timer: 50, enemies: 3, enemySpeed: 100, powerups: 3, bg: 0x0a1a2e },
    { debris: 22, timer: 45, enemies: 4, enemySpeed: 120, powerups: 2, bg: 0x1a0a0e },
    { debris: 25, timer: 40, enemies: 5, enemySpeed: 140, powerups: 3, bg: 0x1a0505 },
  ];
  const TOTAL_LEVELS = LEVELS.length;
  const VACUUM_RADIUS = 170;

  // ═══════════════════════════════════════════════════════════════════════════
  // AUDIO MANAGER — all sound generated via Web Audio API, no external files
  // ═══════════════════════════════════════════════════════════════════════════
  class AudioManager {
    constructor() {
      this._ctx = null;
      this._musicNodes = []; // all nodes belonging to current music track
      this._subBassInterval = null;
    }

    /** Lazily create / resume the shared AudioContext after a user gesture. */
    _getCtx() {
      if (!this._ctx) this._ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this._ctx.state === 'suspended') this._ctx.resume();
      return this._ctx;
    }

    /** Internal: play a tone with an exponential fade-out. */
    _tone(freq, dur, type = 'sine', gain = 0.25, startOffset = 0) {
      try {
        const ctx = this._getCtx();
        const osc = ctx.createOscillator();
        const g   = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime + startOffset);
        g.gain.setValueAtTime(gain, ctx.currentTime + startOffset);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + startOffset + dur);
        osc.start(ctx.currentTime + startOffset);
        osc.stop(ctx.currentTime + startOffset + dur + 0.01);
      } catch(e) { /* audio errors are non-fatal */ }
    }

    /** Stop all currently playing music nodes. */
    stopMusic() {
      if (this._subBassInterval) { clearInterval(this._subBassInterval); this._subBassInterval = null; }
      this._musicNodes.forEach(n => { try { n.stop(); } catch(e){} });
      this._musicNodes = [];
    }

    /**
     * Slow ambient space drone for the menu:
     * two sine oscillators (80 Hz, 120 Hz) with a 0.1 Hz LFO on volume.
     */
    playMenuMusic() {
      this.stopMusic();
      try {
        const ctx = this._getCtx();
        [80, 120].forEach((freq, i) => {
          const osc     = ctx.createOscillator();
          const oscGain = ctx.createGain();
          const lfo     = ctx.createOscillator();
          const lfoGain = ctx.createGain();

          osc.type = 'sine';
          osc.frequency.value = freq;
          oscGain.gain.value = i === 0 ? 0.07 : 0.05; // base level

          lfo.type = 'sine';
          lfo.frequency.value = 0.1; // breathing speed
          lfoGain.gain.value = 0.04; // modulation depth

          lfo.connect(lfoGain);
          lfoGain.connect(oscGain.gain); // LFO modulates the gain
          osc.connect(oscGain);
          oscGain.connect(ctx.destination);

          osc.start(); lfo.start();
          this._musicNodes.push(osc, lfo);
        });
      } catch(e) {}
    }

    /**
     * Tense rhythmic drone for gameplay:
     * three oscillators (80, 120, 160 Hz), faster LFO (0.3 Hz),
     * plus a sub-bass pulse every 2 seconds.
     */
    playGameMusic() {
      this.stopMusic();
      try {
        const ctx = this._getCtx();
        [80, 120, 160].forEach((freq, i) => {
          const osc     = ctx.createOscillator();
          const oscGain = ctx.createGain();
          const lfo     = ctx.createOscillator();
          const lfoGain = ctx.createGain();

          osc.type = 'sine';
          osc.frequency.value = freq;
          oscGain.gain.value = [0.06, 0.04, 0.03][i];

          lfo.type = 'sine';
          lfo.frequency.value = 0.3;
          lfoGain.gain.value = 0.03;

          lfo.connect(lfoGain);
          lfoGain.connect(oscGain.gain);
          osc.connect(oscGain);
          oscGain.connect(ctx.destination);

          osc.start(); lfo.start();
          this._musicNodes.push(osc, lfo);
        });

        // Sub-bass pulse every 2 s
        this._subBassInterval = setInterval(() => {
          try {
            const c   = this._getCtx();
            const o   = c.createOscillator();
            const g   = c.createGain();
            o.connect(g); g.connect(c.destination);
            o.type = 'sine';
            o.frequency.value = 60;
            g.gain.setValueAtTime(0.12, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.4);
            o.start(); o.stop(c.currentTime + 0.4);
          } catch(e) {}
        }, 2000);
      } catch(e) {}
    }

    /** Short ascending two-tone blip on debris collect. */
    playCollectSound() {
      this._tone(440, 0.05, 'triangle', 0.2);
      this._tone(880, 0.10, 'triangle', 0.18, 0.05);
    }

    /** Harsh descending buzz when player takes a hit. */
    playHitSound() {
      try {
        const ctx = this._getCtx();
        const osc = ctx.createOscillator();
        const g   = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.3);
        g.gain.setValueAtTime(0.35, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.start(); osc.stop(ctx.currentTime + 0.31);
      } catch(e) {}
    }

    /** Rising arpeggio C5→E5→G5 on power-up collect. */
    playPowerUpSound() {
      [523, 659, 784].forEach((f, i) => this._tone(f, 0.12, 'sine', 0.25, i * 0.12));
    }

    /** Triumphant four-note rise on level complete. */
    playLevelCompleteSound() {
      [523, 659, 784, 1047].forEach((f, i) => this._tone(f, 0.15, 'sine', 0.3, i * 0.15));
    }

    /**
     * Rocket boost sound for Super Vacuum pickup:
     * white-noise burst through a 800 Hz lowpass filter,
     * gain: 0→0.6 over 0.15 s (ignition), hold 0.4 s, fade to 0 over 1 s.
     */
    playRocketBoostSound() {
      try {
        const ctx    = this._getCtx();
        const rate   = ctx.sampleRate;
        const bufLen = rate * 2; // 2-second buffer
        const buf    = ctx.createBuffer(1, bufLen, rate);
        const data   = buf.getChannelData(0);
        for (let i = 0; i < bufLen; i++) data[i] = Math.random() * 2 - 1;

        const src    = ctx.createBufferSource();
        src.buffer   = buf;
        src.loop     = false;

        const filter       = ctx.createBiquadFilter();
        filter.type        = 'lowpass';
        filter.frequency.value = 800;
        filter.Q.value     = 0.5;

        const gain = ctx.createGain();
        const t    = ctx.currentTime;
        gain.gain.setValueAtTime(0,    t);
        gain.gain.linearRampToValueAtTime(0.6, t + 0.15);  // ignition burst
        gain.gain.setValueAtTime(0.6,  t + 0.55);           // hold
        gain.gain.linearRampToValueAtTime(0.15, t + 1.55); // sustained fade
        gain.gain.linearRampToValueAtTime(0.0,  t + 1.6);  // silent

        src.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        src.start(t);
        src.stop(t + 1.6);
      } catch(e) {}
    }

    /** Low descending tone on game over. */
    playGameOverSound() {
      try {
        const ctx = this._getCtx();
        const osc = ctx.createOscillator();
        const g   = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.8);
        g.gain.setValueAtTime(0.3, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
        osc.start(); osc.stop(ctx.currentTime + 0.81);
      } catch(e) {}
    }
  }
  // Single global instance
  const AM = new AudioManager();

  // ═══════════════════════════════════════════════════════════════════════════
  // TEXTURE FACTORY — all graphics drawn programmatically, no external files
  // ═══════════════════════════════════════════════════════════════════════════
  function buildTextures(scene) {
    // ── Player Ship (42 × 46) — pixel-art arcade fighter style ─────────────
    // Fuselage: 38 px tall pentagon, steel blue. Wings: delta swept-back.
    // Cockpit: cyan oval. Engine block: dark grey with two ports.
    if (!scene.textures.exists('ship')) {
      const g = scene.add.graphics();
      const cx = 21;

      // Delta wings (draw first, behind fuselage)
      g.fillStyle(0x778899, 1);
      g.fillPoints([{x:cx-8,y:20},{x:cx-17,y:42},{x:cx-8,y:42}], true); // left
      g.fillPoints([{x:cx+8,y:20},{x:cx+17,y:42},{x:cx+8,y:42}], true); // right
      g.lineStyle(1.5, 0x334455, 1);
      g.strokePoints([{x:cx-8,y:20},{x:cx-17,y:42},{x:cx-8,y:42}], true);
      g.strokePoints([{x:cx+8,y:20},{x:cx+17,y:42},{x:cx+8,y:42}], true);

      // Main fuselage pentagon — pointed top, flat bottom, steel blue
      g.fillStyle(0x4a6fa5, 1);
      g.fillPoints([
        {x:cx,   y:4},  // top point
        {x:cx+8, y:16}, // upper-right shoulder
        {x:cx+7, y:42}, // lower-right
        {x:cx-7, y:42}, // lower-left
        {x:cx-8, y:16}  // upper-left shoulder
      ], true);

      // Highlight stripe down centre
      g.fillStyle(0x8ab4f8, 0.75);
      g.fillRect(cx-1, 5, 2, 36);

      // Engine block at base of fuselage
      g.fillStyle(0x222222, 1);
      g.fillRect(cx-7, 40, 14, 6);

      // Two circular engine ports
      g.fillStyle(0x000000, 1);
      g.fillCircle(cx-3, 44, 2.5);
      g.fillCircle(cx+3, 44, 2.5);
      // Dim orange inner glow
      g.fillStyle(0xff6600, 0.35);
      g.fillCircle(cx-3, 44, 1.5);
      g.fillCircle(cx+3, 44, 1.5);

      // Cockpit — elongated cyan oval near top of fuselage
      g.fillStyle(0x00ffff, 0.95);
      g.fillEllipse(cx, 15, 8, 13);
      // White glint in upper-left of cockpit
      g.fillStyle(0xffffff, 0.9);
      g.fillCircle(cx-2, 11, 1.5);

      g.generateTexture('ship', 42, 46);
      g.destroy();
    }

    // ── Debris variants (44 × 44 each) ───────────────────────────────────────
    // Six different jagged polygons with varied colors
    const debrisColorSets = [
      { outer: 0x555555, inner: 0xaaaaaa }, // standard grey
      { outer: 0x4a4a4a, inner: 0x888888 }, // dark grey
      { outer: 0x666666, inner: 0xbbbbbb }, // lighter grey
      { outer: 0x6B4010, inner: 0x9B6030 }, // rust brown
      { outer: 0x503a20, inner: 0x8a6040 }, // darker rust
      { outer: 0x5a5060, inner: 0x9090a0 }, // purple-grey
    ];
    for (let v = 0; v < 6; v++) {
      if (scene.textures.exists(`debris_${v}`)) continue;
      const g  = scene.add.graphics();
      const cx = 22, cy = 22, r = 17;
      const { outer, inner } = debrisColorSets[v];
      const numPts = 8 + (v % 3); // 8–10 vertices per piece
      const pts = [];
      for (let i = 0; i < numPts; i++) {
        const ang = (i / numPts) * Math.PI * 2;
        // Deterministic irregular radius — different per variant
        const wobble = 0.55 + 0.45 * Math.abs(Math.sin(v * 5.1 + i * 2.4));
        pts.push({ x: cx + r * wobble * Math.cos(ang), y: cy + r * wobble * Math.sin(ang) });
      }
      g.fillStyle(outer, 1);
      g.fillPoints(pts, true);
      // Inner lighter highlight
      const innerPts = pts.map(p => ({ x: cx + (p.x-cx)*0.45, y: cy + (p.y-cy)*0.45 }));
      g.fillStyle(inner, 0.7);
      g.fillPoints(innerPts, true);
      // Edge outline
      g.lineStyle(1, 0x222222, 0.7);
      g.strokePoints(pts, true);
      // Surface scratch
      g.lineStyle(1, 0x333333, 0.5);
      g.beginPath();
      g.moveTo(cx - 4 + v, cy - 6); g.lineTo(cx + 5 - v, cy + 4);
      g.strokePath();
      g.generateTexture(`debris_${v}`, 44, 44);
      g.destroy();
    }

    // ── Enemy Rogue Satellite (46 × 46) — 35% smaller than original ─────────
    if (!scene.textures.exists('satellite')) {
      const g = scene.add.graphics();
      const cx = 23, cy = 23, bodyR = 8;
      // Spikes (10 irregular protrusions) — radii reduced by 35%
      for (let i = 0; i < 10; i++) {
        const baseAng  = (i / 10) * Math.PI * 2;
        const angOff   = Math.sin(i * 1.7) * 0.18;
        const ang      = baseAng + angOff;
        const tipR     = i % 3 === 0 ? 18 : i % 2 === 0 ? 15 : 12;
        const sideAng1 = ang - 0.22;
        const sideAng2 = ang + 0.22;
        g.fillStyle(0xbb0000, 1);
        g.fillPoints([
          {x: cx + bodyR * Math.cos(sideAng1), y: cy + bodyR * Math.sin(sideAng1)},
          {x: cx + tipR  * Math.cos(ang),      y: cy + tipR  * Math.sin(ang)},
          {x: cx + bodyR * Math.cos(sideAng2), y: cy + bodyR * Math.sin(sideAng2)},
        ], true);
      }
      // Dark core body
      g.fillStyle(0x880000, 1);
      g.fillCircle(cx, cy, bodyR);
      // Glowing inner core
      g.fillStyle(0xff2200, 0.9);
      g.fillCircle(cx, cy, 4);
      g.fillStyle(0xff8888, 1);
      g.fillCircle(cx - 1, cy - 1, 2);
      // Left antenna arm
      g.lineStyle(2, 0xaa1111, 1);
      g.beginPath(); g.moveTo(cx - bodyR - 1, cy); g.lineTo(cx - 20, cy - 4); g.strokePath();
      g.lineStyle(2, 0xff3333, 0.8);
      g.beginPath(); g.moveTo(cx-20, cy-4); g.lineTo(cx-23, cy-1);  g.strokePath();
      g.beginPath(); g.moveTo(cx-20, cy-4); g.lineTo(cx-22, cy-8);  g.strokePath();
      // Right antenna arm
      g.lineStyle(2, 0xaa1111, 1);
      g.beginPath(); g.moveTo(cx + bodyR + 1, cy); g.lineTo(cx + 20, cy + 4); g.strokePath();
      g.lineStyle(2, 0xff3333, 0.8);
      g.beginPath(); g.moveTo(cx+20, cy+4); g.lineTo(cx+23, cy+1);  g.strokePath();
      g.beginPath(); g.moveTo(cx+20, cy+4); g.lineTo(cx+22, cy+8);  g.strokePath();
      g.generateTexture('satellite', 46, 46);
      g.destroy();
    }

    // ── Shield Power-up — hexagonal badge, electric blue, chevron icon (52×52)
    if (!scene.textures.exists('powerup_shield')) {
      const g = scene.add.graphics();
      const cx = 26, cy = 26, r = 21;
      const hexPts = [], glowPts = [];
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2 - Math.PI / 6;
        hexPts.push({ x: cx + r * Math.cos(a),       y: cy + r * Math.sin(a) });
        glowPts.push({ x: cx + (r+5)*Math.cos(a),    y: cy + (r+5)*Math.sin(a) });
      }
      // Outer glow ring
      g.fillStyle(0x0044ff, 0.25);
      g.fillPoints(glowPts, true);
      // Main hexagon
      g.fillStyle(0x0066ff, 0.92);
      g.fillPoints(hexPts, true);
      g.lineStyle(2.5, 0x88ccff, 1);
      g.strokePoints(hexPts, true);
      // Inner light highlight
      g.fillStyle(0x44aaff, 0.3);
      const innerHex = hexPts.map(p => ({x: cx+(p.x-cx)*0.55, y: cy+(p.y-cy)*0.55}));
      g.fillPoints(innerHex, true);
      // Shield kite/heraldic outline — flat top, tapering sides, point at bottom
      // Uses strokePoints (bezierCurveTo not available in Phaser path API)
      g.lineStyle(2, 0xffffff, 1);
      const shieldPts = [
        { x: cx-9,  y: cy-8  }, // top-left
        { x: cx+9,  y: cy-8  }, // top-right
        { x: cx+11, y: cy+0  }, // right shoulder
        { x: cx+7,  y: cy+6  }, // right lower
        { x: cx,    y: cy+12 }, // bottom point
        { x: cx-7,  y: cy+6  }, // left lower
        { x: cx-11, y: cy+0  }, // left shoulder
      ];
      g.strokePoints(shieldPts, true);
      g.generateTexture('powerup_shield', 52, 52);
      g.destroy();
    }

    // ── Vacuum Power-up — yellow 8-point starburst, inner ring, glow (52×52)
    if (!scene.textures.exists('powerup_vacuum')) {
      const g = scene.add.graphics();
      const cx = 26, cy = 26;
      const pts = [];
      for (let i = 0; i < 16; i++) {
        const ang = (i / 16) * Math.PI * 2 - Math.PI / 2;
        const r   = i % 2 === 0 ? 21 : 9;
        pts.push({ x: cx + r * Math.cos(ang), y: cy + r * Math.sin(ang) });
      }
      // Outer glow
      g.fillStyle(0xffaa00, 0.28);
      g.fillCircle(cx, cy, 24);
      // 8-point starburst
      g.fillStyle(0xffcc00, 1);
      g.fillPoints(pts, true);
      g.lineStyle(1, 0xffffff, 0.4);
      g.strokePoints(pts, true);
      // Darker spinning inner ring (drawn statically, animated via tween on sprite)
      g.fillStyle(0xff9900, 1);
      g.fillCircle(cx, cy, 9);
      // Bright center
      g.fillStyle(0xffee66, 1);
      g.fillCircle(cx, cy, 5);
      g.generateTexture('powerup_vacuum', 52, 52);
      g.destroy();
    }

    // ── HUD Heart (24×22) — proper drawn heart shape ─────────────────────────
    if (!scene.textures.exists('heart')) {
      const g = scene.add.graphics();
      g.fillStyle(0xff2244, 1);
      g.fillCircle(7,  7, 6.5);
      g.fillCircle(17, 7, 6.5);
      g.fillTriangle(1, 9, 23, 9, 12, 22);
      // Highlight
      g.fillStyle(0xff88aa, 0.65);
      g.fillCircle(5, 5, 3);
      g.generateTexture('heart', 24, 22);
      g.destroy();
    }

    // ── Thruster Particle (8×8) ───────────────────────────────────────────────
    if (!scene.textures.exists('particle')) {
      const g = scene.add.graphics();
      g.fillStyle(0xff8800, 1);
      g.fillCircle(4, 4, 4);
      g.generateTexture('particle', 8, 8);
      g.destroy();
    }

    // ── Enemy Spawn Warning Arrow (32×24) ────────────────────────────────────
    if (!scene.textures.exists('spawn_arrow')) {
      const g = scene.add.graphics();
      g.fillStyle(0xff0000, 0.9);
      g.fillTriangle(16, 0, 32, 24, 0, 24);
      g.lineStyle(1.5, 0xff9999, 0.9);
      g.strokeTriangle(16, 0, 32, 24, 0, 24);
      g.generateTexture('spawn_arrow', 32, 24);
      g.destroy();
    }
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // STARFIELD UTILITY
  // ═══════════════════════════════════════════════════════════════════════════
  /**
   * Build a star-field background.
   * If dynamic=true, stores individual rectangle objects on scene.starDots
   * so they can be scrolled downward each frame in update().
   */
  function buildStarfield(scene, dynamic = false) {
    const { width, height } = scene.scale;
    // Space gradient background
    const bg = scene.add.graphics();
    const bgColor = scene.game.registry.get('bgColor') || 0x000011;
    bg.fillStyle(bgColor, 1);
    bg.fillRect(0, 0, width, height);

    const count = dynamic ? 160 : 220;
    if (dynamic) {
      scene.starDots = [];
      for (let i = 0; i < count; i++) {
        const x     = Phaser.Math.Between(0, width);
        const y     = Phaser.Math.Between(0, height);
        const size  = Math.random() < 0.12 ? 2 : 1;
        const alpha = Phaser.Math.FloatBetween(0.25, 1.0);
        const dot   = scene.add.rectangle(x, y, size, size, 0xffffff, alpha);
        dot.scrollFactor = 0; // stay fixed relative to camera
        dot._speed = Phaser.Math.FloatBetween(0.12, 0.55);
        scene.starDots.push(dot);
      }
    } else {
      const g = scene.add.graphics();
      for (let i = 0; i < count; i++) {
        const x     = Phaser.Math.Between(0, width);
        const y     = Phaser.Math.Between(0, height);
        const r     = Math.random() < 0.1 ? 1.5 : 0.8;
        const alpha = Phaser.Math.FloatBetween(0.3, 1.0);
        g.fillStyle(0xffffff, alpha);
        g.fillCircle(x, y, r);
      }
    }
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // MENU SCENE
  // ═══════════════════════════════════════════════════════════════════════════
  class MenuScene extends Phaser.Scene {
    constructor() { super({ key: 'MenuScene' }); }

    create() {
      // Reset all persistent state to defaults
      this.game.registry.set('currentLevel', 1);
      this.game.registry.set('score', 0);
      this.game.registry.set('health', 3);
      this.game.registry.set('bgColor', 0x000011);

      buildStarfield(this, true);   // scrolling starfield per spec
      buildTextures(this);

      const { width, height } = this.scale;

      // Title
      this.add.text(width/2, 100, 'COSMIC CLEANUP', {
        font: 'bold 46px "Courier New"',
        fill: '#66ddff',
        stroke: '#003366', strokeThickness: 6,
        shadow: { color: '#00aaff', blur: 24, fill: true }
      }).setOrigin(0.5);
      this.add.text(width/2, 152, 'The Space Janitor', {
        font: '22px "Courier New"', fill: '#aaddff'
      }).setOrigin(0.5);

      // Story blurb
      this.add.text(width/2, 225,
        '"A VIP space cruiser is inbound.\nClear Earth\'s orbit across 5 levels\nbefore it docks — or face the consequences."',
        { font: '15px "Courier New"', fill: '#cceecc', align: 'center', lineSpacing: 6 }
      ).setOrigin(0.5);

      // Level table summary
      this.add.text(width/2, 320,
        'LEVEL 1 — 15 debris / 60 s   LEVEL 2 — 18 debris / 55 s\n' +
        'LEVEL 3 — 20 debris / 50 s   LEVEL 4 — 22 debris / 45 s\n' +
        'LEVEL 5 — 25 debris / 40 s',
        { font: '12px "Courier New"', fill: '#7799bb', align: 'center', lineSpacing: 4 }
      ).setOrigin(0.5);

      this.add.text(width/2, 388, 'WASD / Arrow Keys to move  •  Auto-collect on contact', {
        font: '13px "Courier New"', fill: '#88aacc'
      }).setOrigin(0.5);
      this.add.text(width/2, 408, 'P or ESC to pause', {
        font: '13px "Courier New"', fill: '#667788'
      }).setOrigin(0.5);

      // Start button
      const btn = this.add.text(width/2, 466, '[ START MISSION ]', {
        font: 'bold 28px "Courier New"', fill: '#ffffff',
        backgroundColor: '#003388', padding: { x:22, y:13 },
        stroke: '#0066ff', strokeThickness: 3
      }).setOrigin(0.5).setInteractive({ useHandCursor: true });
      btn.on('pointerover', () => btn.setStyle({ backgroundColor: '#0055cc' }));
      btn.on('pointerout',  () => btn.setStyle({ backgroundColor: '#003388' }));
      btn.on('pointerdown', () => {
        AM._getCtx(); // unlock audio on first gesture
        AM.stopMusic();
        AM.playGameMusic();
        this.scene.start('GameScene');
      });
      this.tweens.add({ targets: btn, scaleX:1.05, scaleY:1.05, duration:900, yoyo:true, repeat:-1, ease:'Sine.easeInOut' });

      // Spacebar also starts the game
      const spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
      spaceKey.once('down', () => {
        AM._getCtx();
        AM.stopMusic();
        AM.playGameMusic();
        this.scene.start('GameScene');
      });

      // Decorative ship bobbing at bottom
      const ship = this.add.image(width/2, 548, 'ship').setScale(2.2);
      this.tweens.add({ targets: ship, y: 538, duration:1400, yoyo:true, repeat:-1, ease:'Sine.easeInOut' });

      // Start menu music
      AM.playMenuMusic();
    }

    /** Scroll the starfield downward each frame. */
    update() {
      if (this.starDots) {
        const h = this.scale.height;
        this.starDots.forEach(s => {
          s.y += s._speed;
          if (s.y > h + 2) s.y = -2;
        });
      }
    }
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // GAME SCENE
  // ═══════════════════════════════════════════════════════════════════════════
  class GameScene extends Phaser.Scene {
    constructor() { super({ key: 'GameScene' }); }

    init() {
      // Pull persistent state from registry
      this._level      = this.game.registry.get('currentLevel') || 1;
      this._score      = this.game.registry.get('score')        || 0;
      this._cfg        = LEVELS[this._level - 1];

      // Per-level state — health carries over between levels (resets to 3 only on level 1)
      this._health        = (this._level === 1)
                              ? 3
                              : (this.game.registry.get('health') || 3);
      this._collected     = 0;
      this._timeLeft      = this._cfg.timer;
      this._shieldActive  = false;
      this._vacuumActive  = false;
      this._shieldTimer   = 0;
      this._vacuumTimer   = 0;
      this._hitCooldown   = 0;
      this._paused        = false;
      this._flameTick     = 0;
      this._frameCount    = 0;
      // Combo tracking
      this._comboTimes   = [];  // timestamps of recent collects
      this._comboActive  = false;
      this._comboTimer   = 0;
    }

    preload() {
      buildTextures(this);
    }

    create() {
      const { width, height } = this.scale;
      this.game.registry.set('bgColor', this._cfg.bg);

      // ── Background ─────────────────────────────────────────────────────────
      buildStarfield(this, true);

      // ── Per-frame graphics layer (flame, pulses, glints, vacuum circle) ────
      this._fxGfx = this.add.graphics().setDepth(10);

      // ── Player ─────────────────────────────────────────────────────────────
      this._player = this.physics.add.image(width/2, height/2, 'ship')
        .setDepth(20)
        .setCollideWorldBounds(false)
        .setDrag(130)
        .setMaxVelocity(290);
      // Physics hitbox matched to the 42×46 texture
      this._player.setSize(34, 40);

      // ── Thruster particle emitter ──────────────────────────────────────────
      this._thruster = this.add.particles(0, 0, 'particle', {
        lifespan: 200, speed: { min:35, max:80 },
        scale: { start:0.85, end:0 }, alpha: { start:0.8, end:0 },
        tint: [0xff8800, 0xff4400, 0xffdd00], blendMode: 'ADD', emitting: false
      }).setDepth(18);

      // ── Debris ─────────────────────────────────────────────────────────────
      this._debrisGroup = this.physics.add.group();
      this._glintData   = []; // {sprite, phase} for glinting pieces
      for (let i = 0; i < this._cfg.debris; i++) {
        const x = Phaser.Math.Between(50, width - 50);
        const y = Phaser.Math.Between(100, height - 60);
        const variant = i % 6;
        const piece = this._debrisGroup.create(x, y, `debris_${variant}`);
        piece.setBounce(0.8).setCollideWorldBounds(false).setDepth(15);
        const spd = Phaser.Math.Between(18, 62);
        const ang = Phaser.Math.FloatBetween(0, Math.PI * 2);
        piece.setVelocity(Math.cos(ang)*spd, Math.sin(ang)*spd);
        piece.setAngularVelocity(Phaser.Math.Between(-50, 50));
        // 1 in 4 pieces gets a glint
        if (i % 4 === 0) this._glintData.push({ sprite: piece, phase: Phaser.Math.FloatBetween(0, Math.PI*2) });
      }

      // ── Enemy Satellites ───────────────────────────────────────────────────
      this._satGroup  = this.physics.add.group();
      this._satExtras = []; // {sprite, pulsePhase, flickerCount}
      for (let i = 0; i < this._cfg.enemies; i++) {
        this._spawnSatellite(i);
      }

      // ── Power-ups ──────────────────────────────────────────────────────────
      this._powerupGroup = this.physics.add.staticGroup();
      this._powerupBobData = []; // {sprite, baseY}
      const puTypes = ['powerup_shield', 'powerup_vacuum'];
      for (let i = 0; i < this._cfg.powerups; i++) {
        const type = puTypes[i % 2];
        this._spawnPowerup(type);
      }
      // Orbit dots for vacuum power-up (drawn in fxGfx each frame)
      this._orbitAngle = 0;

      // ── Shield FX overlay ─────────────────────────────────────────────────
      this._shieldFxGfx = this.add.graphics().setDepth(19);

      // ── Physics overlaps / colliders ──────────────────────────────────────
      this.physics.add.overlap(this._player, this._debrisGroup, this._collectDebris, null, this);
      this.physics.add.collider(this._satGroup, this._debrisGroup, this._scatterDebris, null, this);
      this.physics.add.collider(this._player, this._satGroup, this._playerHit, null, this);
      this.physics.add.overlap(this._player, this._powerupGroup, this._collectPowerup, null, this);

      // ── Input ──────────────────────────────────────────────────────────────
      this._cursors = this.input.keyboard.createCursorKeys();
      this._wasd    = this.input.keyboard.addKeys({
        up:    Phaser.Input.Keyboard.KeyCodes.W,
        down:  Phaser.Input.Keyboard.KeyCodes.S,
        left:  Phaser.Input.Keyboard.KeyCodes.A,
        right: Phaser.Input.Keyboard.KeyCodes.D,
      });
      this._keyP   = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.P);
      this._keyESC = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.ESC);

      // Guard flag to prevent double-ending the game
      this._gameEnded = false;

      // ── Countdown timer ────────────────────────────────────────────────────
      this._gameTimer = this.time.addEvent({
        delay: 1000, callback: this._tickTimer,
        callbackScope: this, repeat: this._cfg.timer - 1
      });

      // ── HUD ────────────────────────────────────────────────────────────────
      this._buildHUD();

      // ── Pause overlay (hidden by default) ─────────────────────────────────
      this._pauseOverlay = this.add.container(width/2, height/2).setDepth(100).setVisible(false);
      const pauseBg = this.add.rectangle(0, 0, 340, 120, 0x000033, 0.88).setStrokeStyle(2, 0x4466ff);
      const pauseTxt = this.add.text(0, -14, 'PAUSED', {
        font: 'bold 44px "Courier New"', fill: '#ffffff',
        stroke: '#003399', strokeThickness: 4
      }).setOrigin(0.5);
      const pauseSub = this.add.text(0, 32, 'Press P or ESC to resume', {
        font: '16px "Courier New"', fill: '#aabbdd'
      }).setOrigin(0.5);
      this._pauseOverlay.add([pauseBg, pauseTxt, pauseSub]);

      // ── Controls reminder (fades out after 5 s) ────────────────────────────
      this._controlsTxt = this.add.text(10, height - 22,
        'WASD / Arrows to move', {
          font: '12px "Courier New"', fill: '#6688aa',
          backgroundColor: '#00001188', padding: { x:6, y:3 }
        }).setDepth(90).setAlpha(0.85);
      this.tweens.add({ targets: this._controlsTxt, alpha: 0, delay: 5000, duration: 1200 });
    }

    // ── UPDATE ────────────────────────────────────────────────────────────────
    update(time, delta) {
      this._frameCount++;
      const dt = delta / 1000;

      // Scroll stars downward
      if (this.starDots) {
        this.starDots.forEach(s => {
          s.y += s._speed;
          if (s.y > this.scale.height + 2) s.y = -2;
        });
      }

      // Toggle pause
      if (Phaser.Input.Keyboard.JustDown(this._keyP) || Phaser.Input.Keyboard.JustDown(this._keyESC)) {
        this._paused ? this._resume() : this._pause();
      }
      if (this._paused) return;

      // Clear per-frame FX layer
      this._fxGfx.clear();
      this._shieldFxGfx.clear();

      // Movement + flame
      this._handleInput(dt);

      // Satellite AI + visual effects
      this._updateSatellites(dt);

      // Power-up animation (bob, orbit dots)
      this._updatePowerupFX(time);

      // Active power-up timers
      this._updatePowerupTimers(dt);

      // Vacuum magnet pull
      if (this._vacuumActive) this._applyVacuumMagnet();

      // Draw vacuum radius preview circle
      if (this._vacuumActive) this._drawVacuumCircle();

      // ── Player: hard boundary walls (no wrap), debris/enemies still wrap ──
      const { width, height } = this.scale;
      const bm = 20; // boundary margin px
      if (this._player.x < bm)          { this._player.x = bm;          this._player.body.velocity.x = 0; }
      if (this._player.x > width - bm)  { this._player.x = width - bm;  this._player.body.velocity.x = 0; }
      if (this._player.y < bm)          { this._player.y = bm;          this._player.body.velocity.y = 0; }
      if (this._player.y > height - bm) { this._player.y = height - bm; this._player.body.velocity.y = 0; }
      this._debrisGroup.getChildren().forEach(d => this.physics.world.wrap(d, 22));
      this._satGroup.getChildren().forEach(s => this.physics.world.wrap(s, 23));

      // ── Proximity danger ring — pulsing red circle around player ──────────
      const dangerClose = this._satExtras.some(ext => {
        if (!ext.sprite.active) return false;
        const dx = this._player.x - ext.sprite.x;
        const dy = this._player.y - ext.sprite.y;
        return Math.sqrt(dx*dx + dy*dy) < 180;
      });
      if (dangerClose) {
        const wa = 0.2 + 0.6 * (0.5 + 0.5 * Math.sin(time * 0.006));
        this._fxGfx.lineStyle(2, 0xff0000, wa);
        this._fxGfx.strokeCircle(this._player.x, this._player.y, 55);
      }

      // Shield FX
      if (this._shieldActive) {
        this._shieldFxGfx.lineStyle(3, 0x44aaff, 0.85);
        this._shieldFxGfx.strokeCircle(this._player.x, this._player.y, 38);
        this._shieldFxGfx.fillStyle(0x0044ff, 0.1);
        this._shieldFxGfx.fillCircle(this._player.x, this._player.y, 38);
      }

      // Debris glints
      this._drawGlints(time);

      // Satellite pulse glows (drawn on fxGfx)
      this._drawSatPulses(time);

      // Hit cooldown flash
      if (this._hitCooldown > 0) {
        this._hitCooldown -= dt;
        this._player.setAlpha(Math.sin(time * 0.025) > 0 ? 1 : 0.3);
      } else {
        this._player.setAlpha(1);
      }

      // Combo timer
      if (this._comboActive) {
        this._comboTimer -= dt;
        if (this._comboTimer <= 0) this._comboActive = false;
      }

      // Update HUD
      this._updateHUD(time);
    }

    // ── INPUT ─────────────────────────────────────────────────────────────────
    _handleInput(dt) {
      const thrust = 350;
      const up    = this._cursors.up.isDown    || this._wasd.up.isDown;
      const down  = this._cursors.down.isDown  || this._wasd.down.isDown;
      const left  = this._cursors.left.isDown  || this._wasd.left.isDown;
      const right = this._cursors.right.isDown || this._wasd.right.isDown;

      let vx = 0, vy = 0;
      if (up)    vy = -1;
      if (down)  vy =  1;
      if (left)  vx = -1;
      if (right) vx =  1;
      if (vx !== 0 && vy !== 0) { vx *= 0.707; vy *= 0.707; }
      const moving = vx !== 0 || vy !== 0;

      if (moving) {
        this._player.setAcceleration(vx * thrust, vy * thrust);
        const targetRot = Math.atan2(vy, vx) + Math.PI / 2;
        this._player.setRotation(
          Phaser.Math.Angle.RotateTo(this._player.rotation, targetRot, 0.13)
        );
        // Thruster particles — offset scaled to match new ship size
        this._thruster.setPosition(
          this._player.x + Math.cos(this._player.rotation + Math.PI) * 8,
          this._player.y + Math.sin(this._player.rotation + Math.PI) * 8
        );
        this._thruster.explode(3);
      } else {
        this._player.setAcceleration(0, 0);
      }

      // Animated engine flame (drawn onto fxGfx, behind player)
      this._drawFlame(moving);
    }

    /**
     * Draw animated engine flames every frame.
     * Idle: faint short flicker always visible.
     * Thrust: three-ellipse teardrop plume (28 px).
     * Boost (Super Vacuum active): four-ellipse plume with blue tip (48 px), 30% wider.
     * Flames drawn on _fxGfx (depth 10) so they appear behind the ship (depth 20).
     */
    _drawFlame(moving) {
      this._flameTick++;
      const px  = this._player.x;
      const py  = this._player.y;
      const rot = this._player.rotation;
      // Nozzle at engine end of ship (behind along facing direction)
      // Engine nozzle is at local (0, +23) — bottom of fuselage in local space.
      // Local +y direction in world coords: (-sin(rot), +cos(rot)).
      const nozzleX = px - Math.sin(rot) * 23;
      const nozzleY = py + Math.cos(rot) * 23;
      // Flame extends in the local +y direction, which has world angle rot + π/2.
      const flameDir = rot + Math.PI / 2;

      // Port offsets (two engine ports side by side)
      const perpCos = Math.cos(rot), perpSin = Math.sin(rot);
      const portOff = 3;
      const ports = [
        { x: nozzleX - perpCos * portOff, y: nozzleY - perpSin * portOff },
        { x: nozzleX + perpCos * portOff, y: nozzleY + perpSin * portOff },
      ];

      const isBoost = this._vacuumActive;

      ports.forEach(port => {
        if (moving) {
          // Thrust or boost plume — three overlapping ellipses
          const fh  = isBoost ? 48 : 28;
          const wm  = isBoost ? 1.3 : 1.0;
          // Base ellipse — orange, closest to engine
          this._drawFlameEllipse(port.x, port.y, flameDir, 5 * wm, fh * 0.28, 0xff6600, 0.9);
          // Mid ellipse — yellow-orange
          this._drawFlameEllipse(port.x, port.y, flameDir, 3.5 * wm, fh * 0.60, 0xffaa00, 0.75);
          // Tip ellipse — bright yellow
          this._drawFlameEllipse(port.x, port.y, flameDir, 2.0 * wm, fh * 0.88, 0xffff00, 0.60);
          if (isBoost) {
            // Electric blue tip for boost
            this._drawFlameEllipse(port.x, port.y, flameDir, 1.5, fh, 0x00aaff, 0.50);
          }
        } else {
          // Idle exhaust — short faint orange flicker, alternates 5 ↔ 7 px each frame
          const idleH = (this._flameTick % 2 === 0) ? 5 : 7;
          this._drawFlameEllipse(port.x, port.y, flameDir, 2.5, idleH, 0xff6600, 0.40);
        }
      });
    }

    /** Draw a rotated ellipse extending from nozzle in flameDir on _fxGfx. */
    _drawFlameEllipse(nozzleX, nozzleY, flameDir, rx, ry, color, alpha) {
      const cosA = Math.cos(flameDir), sinA = Math.sin(flameDir);
      // Offset centre so base of ellipse sits at the nozzle
      const cx = nozzleX + cosA * (ry * 0.5);
      const cy = nozzleY + sinA * (ry * 0.5);
      const steps = 10;
      const pts = [];
      for (let i = 0; i < steps; i++) {
        const t  = (i / steps) * Math.PI * 2;
        const lx = Math.cos(t) * rx;   // perpendicular axis
        const ly = Math.sin(t) * ry;   // flame axis
        pts.push({ x: cx - sinA * lx + cosA * ly, y: cy + cosA * lx + sinA * ly });
      }
      this._fxGfx.fillStyle(color, alpha);
      this._fxGfx.fillPoints(pts, true);
    }

    // ── SATELLITE AI + FX ─────────────────────────────────────────────────────
    _spawnSatellite(index) {
      const { width, height } = this.scale;
      // Spawn near corners, cycling through them
      const corners = [
        [60, 60], [width-60, 60], [60, height-60], [width-60, height-60],
        [width/2, 50]
      ];
      const [sx, sy] = corners[index % corners.length];
      const sat = this._satGroup.create(sx, sy, 'satellite')
        .setBounce(0.55)
        .setCollideWorldBounds(false)
        .setMaxVelocity(this._cfg.enemySpeed * 1.3)
        .setAngularVelocity(Phaser.Math.Between(40, 90))
        .setDepth(16);
      // Physics body matched to reduced 46×46 texture
      sat.setSize(40, 40);
      this._satExtras.push({ sprite: sat, pulsePhase: Phaser.Math.FloatBetween(0, Math.PI*2), flickerCount: 0 });

      // From level 2+, show a spawn warning arrow
      if (this._level >= 2) this._showSpawnWarning(sx, sy);
    }

    /** Move each satellite toward the player using seek behaviour. */
    _updateSatellites(dt) {
      const speed = this._cfg.enemySpeed;
      this._satExtras.forEach(({ sprite }) => {
        if (!sprite.active) return;
        const dx = this._player.x - sprite.x;
        const dy = this._player.y - sprite.y;
        const d  = Math.sqrt(dx*dx + dy*dy) || 1;
        sprite.setVelocity((dx/d)*speed, (dy/d)*speed);
      });
    }

    /** Draw pulsing red glow circles around each satellite. */
    _drawSatPulses(time) {
      this._satExtras.forEach(ext => {
        if (!ext.sprite.active) return;
        const { sprite, pulsePhase } = ext;
        const dx    = this._player.x - sprite.x;
        const dy    = this._player.y - sprite.y;
        const dist2 = Math.sqrt(dx*dx + dy*dy);
        const near  = dist2 < 300;
        const speed = near ? 3.5 : 1.8;

        // Pulse scale oscillates
        const pulse = 0.8 + 0.55 * Math.sin(time * 0.001 * speed + pulsePhase);
        const alpha = near ? 0.55 : 0.3;
        const r     = 28 * pulse;

        this._fxGfx.fillStyle(near ? 0xff0000 : 0xcc0000, alpha);
        this._fxGfx.fillCircle(sprite.x, sprite.y, r);

        // Red tint flicker every 20 frames
        ext.flickerCount++;
        if (ext.flickerCount % 20 === 0) {
          sprite.setTint(near ? 0xff6666 : 0xff3333);
        } else if (ext.flickerCount % 20 === 10) {
          sprite.clearTint();
        }
      });
    }

    // ── DEBRIS GLINTS ─────────────────────────────────────────────────────────
    _drawGlints(time) {
      this._glintData = this._glintData.filter(g => g.sprite.active);
      this._glintData.forEach(({ sprite, phase }) => {
        const alpha = 0.5 + 0.5 * Math.sin(time * 0.003 + phase);
        this._fxGfx.fillStyle(0xffffff, alpha * 0.9);
        this._fxGfx.fillCircle(sprite.x, sprite.y - 4, 2.5);
      });
    }

    // ── POWER-UP ANIMATION ────────────────────────────────────────────────────
    _spawnPowerup(type) {
      const { width, height } = this.scale;
      const x = Phaser.Math.Between(60, width - 60);
      const y = Phaser.Math.Between(80, height - 80);
      const pu = this._powerupGroup.create(x, y, type).setDepth(14);
      this._powerupBobData.push({ sprite: pu, baseY: y, type });
    }

    _updatePowerupFX(time) {
      this._orbitAngle += 0.04;
      // Remove destroyed entries
      this._powerupBobData = this._powerupBobData.filter(d => d.sprite.active);

      this._powerupBobData.forEach(d => {
        // Bob up and down on sine wave
        d.sprite.y = d.baseY + Math.sin(time * 0.002) * 7;
        d.sprite.refreshBody(); // update static body position

        // Shield: bob only — no rotation (rotation removed per spec)

        // Vacuum: draw orbiting white dots
        if (d.type === 'powerup_vacuum' && d.sprite.active) {
          for (let i = 0; i < 4; i++) {
            const ang = this._orbitAngle + (i / 4) * Math.PI * 2;
            const orbitR = 22;
            const ox = d.sprite.x + Math.cos(ang) * orbitR;
            const oy = d.sprite.y + Math.sin(ang) * orbitR;
            this._fxGfx.fillStyle(0xffffff, 0.75);
            this._fxGfx.fillCircle(ox, oy, 2.5);
          }
        }
      });
    }

    // ── VACUUM CIRCLE PREVIEW ─────────────────────────────────────────────────
    _drawVacuumCircle() {
      const { x, y } = this._player;
      const dashes = 26;
      this._fxGfx.lineStyle(1.5, 0xffcc00, 0.45);
      for (let i = 0; i < dashes; i++) {
        const a1 = (i / dashes) * Math.PI * 2;
        const a2 = a1 + (Math.PI * 2 / dashes) * 0.55;
        this._fxGfx.beginPath();
        this._fxGfx.arc(x, y, VACUUM_RADIUS, a1, a2, false, 0.05);
        this._fxGfx.strokePath();
      }
    }

    // ── POWER-UP TIMERS ───────────────────────────────────────────────────────
    _updatePowerupTimers(dt) {
      if (this._shieldActive) {
        this._shieldTimer -= dt;
        if (this._shieldTimer <= 0) {
          this._shieldActive = false;
          this._player.clearTint();
        }
      }
      if (this._vacuumActive) {
        this._vacuumTimer -= dt;
        if (this._vacuumTimer <= 0) {
          this._vacuumActive = false;
          this._player.clearTint();
        }
      }
    }

    // ── VACUUM MAGNET ─────────────────────────────────────────────────────────
    _applyVacuumMagnet() {
      const pull = 210;
      this._debrisGroup.getChildren().forEach(d => {
        const dx = this._player.x - d.x;
        const dy = this._player.y - d.y;
        const dist = Math.sqrt(dx*dx + dy*dy) || 1;
        if (dist < VACUUM_RADIUS) {
          d.setVelocity(
            d.body.velocity.x + (dx/dist) * pull * 0.06,
            d.body.velocity.y + (dy/dist) * pull * 0.06
          );
        }
      });
    }

    // ── COLLISION CALLBACKS ───────────────────────────────────────────────────
    _collectDebris(player, piece) {
      piece.destroy();
      // Remove from glint list
      this._glintData = this._glintData.filter(g => g.sprite !== piece);

      const pts = this._comboActive ? 20 : 10;
      this._score += pts;
      this._collected++;
      AM.playCollectSound();

      // Score pop-up — 20px bold, black drop shadow, spawns above debris, floats 40px in 0.8s
      const popTxt = this._comboActive ? `+${pts} x2!` : `+${pts}`;
      const pop = this.add.text(piece.x, piece.y - 18, popTxt, {
        font: 'bold 20px "Courier New"',
        fill: this._comboActive ? '#ffdd00' : '#ffff44',
        shadow: { offsetX: 2, offsetY: 2, color: '#000000', fill: true }
      }).setDepth(50).setOrigin(0.5);
      this.tweens.add({ targets: pop, y: pop.y - 40, alpha: 0, duration: 800, onComplete: () => pop.destroy() });

      // Combo tracking
      const now = this.time.now;
      this._comboTimes.push(now);
      this._comboTimes = this._comboTimes.filter(t => now - t < 4000);
      if (this._comboTimes.length >= 3 && !this._comboActive) {
        this._activateCombo();
      }

      if (this._collected >= this._cfg.debris) this._endGame(true);
    }

    _activateCombo() {
      this._comboActive = true;
      this._comboTimer  = 5;
      // Anchor to current player position, float upward and fade same as score pop-ups
      const { x, y } = this._player;
      const comboTxt = this.add.text(x, y - 50, 'x2 COMBO!', {
        font: 'bold 24px "Courier New"',
        fill: '#ffd700',
        shadow: { offsetX: 2, offsetY: 2, color: '#000000', fill: true }
      }).setDepth(60).setOrigin(0.5);
      this.tweens.add({ targets: comboTxt, y: y - 90, alpha: 0, duration: 1800, onComplete: () => comboTxt.destroy() });
    }

    _scatterDebris(satellite, piece) {
      const ang = Phaser.Math.FloatBetween(0, Math.PI*2);
      const spd = Phaser.Math.Between(70, 160);
      piece.setVelocity(Math.cos(ang)*spd, Math.sin(ang)*spd);
    }

    _playerHit(player, satellite) {
      if (this._shieldActive || this._hitCooldown > 0) return;
      this._health--;
      this._hitCooldown = 1.6;
      AM.playHitSound();

      // Screen shake
      this.cameras.main.shake(200, 0.008);
      // Hit flash — red for ~3 frames then clear
      player.setTint(0xff3300);
      this.time.delayedCall(55, () => { if (player.active) player.clearTint(); });

      if (this._health <= 0) this._endGame(false);
    }

    _collectPowerup(player, powerup) {
      const type = powerup.texture.key;
      powerup.destroy();
      this._powerupBobData = this._powerupBobData.filter(d => d.sprite.active);

      if (type === 'powerup_shield') {
        AM.playPowerUpSound(); // rising arpeggio (unchanged)
        this._shieldActive = true;
        this._shieldTimer  = 8;
        player.setTint(0x44aaff);
        this._showStatusPop('SHIELD ON  8s', 0x44aaff);
      } else {
        AM.playRocketBoostSound(); // white-noise rocket boost (replaces arpeggio)
        this._vacuumActive = true;
        this._vacuumTimer  = 10;
        player.setTint(0xffcc00);
        this._showStatusPop('SUPER VACUUM  10s', 0xffcc00);
      }
    }

    _showStatusPop(msg, color) {
      const { width } = this.scale;
      const txt = this.add.text(width/2, 90, msg, {
        font: 'bold 18px "Courier New"', fill: '#' + color.toString(16).padStart(6,'0'),
        stroke: '#000000', strokeThickness: 3, backgroundColor: '#00000088',
        padding: { x:10, y:5 }
      }).setDepth(60).setOrigin(0.5);
      this.tweens.add({ targets: txt, y: 65, alpha: 0, delay: 1200, duration: 800, onComplete: () => txt.destroy() });
    }

    // ── SPAWN WARNING ARROW ───────────────────────────────────────────────────
    _showSpawnWarning(spawnX, spawnY) {
      const { width, height } = this.scale;
      // Determine which screen edge the spawn point is nearest
      const distLeft   = spawnX;
      const distRight  = width  - spawnX;
      const distTop    = spawnY;
      const distBottom = height - spawnY;
      const minDist    = Math.min(distLeft, distRight, distTop, distBottom);

      let ax = spawnX, ay = spawnY, rot = 0;
      if      (minDist === distTop)    { ax = spawnX; ay = 20;        rot = 0; }
      else if (minDist === distBottom) { ax = spawnX; ay = height-20; rot = Math.PI; }
      else if (minDist === distLeft)   { ax = 20;     ay = spawnY;    rot = -Math.PI/2; }
      else                             { ax = width-20; ay = spawnY;  rot = Math.PI/2; }

      const arrow = this.add.image(ax, ay, 'spawn_arrow')
        .setRotation(rot).setDepth(80).setAlpha(0.9);
      this.tweens.add({ targets: arrow, alpha: 0, delay: 1200, duration: 300, onComplete: () => arrow.destroy() });
    }

    // ── TIMER TICK ────────────────────────────────────────────────────────────
    _tickTimer() {
      this._timeLeft--;
      if (this._timeLeft <= 0) this._endGame(false);
    }

    // ── HUD ───────────────────────────────────────────────────────────────────
    _buildHUD() {
      const { width } = this.scale;

      // Panel background (top bar)
      this._hudBg = this.add.graphics().setDepth(88);
      this._hudBg.fillStyle(0x000022, 0.78);
      this._hudBg.fillRect(0, 0, width, 46);
      this._hudBg.lineStyle(1, 0x223366, 1);
      this._hudBg.strokeRect(0, 0, width, 46);

      // Score label
      this._scoreTxt = this.add.text(12, 8, 'SCORE  0', {
        font: 'bold 18px "Courier New"', fill: '#66eeff'
      }).setDepth(89);

      // Level label
      this._levelTxt = this.add.text(width/2, 8, `LEVEL ${this._level}`, {
        font: 'bold 18px "Courier New"', fill: '#aaddff'
      }).setDepth(89).setOrigin(0.5, 0);

      // Debris counter
      this._debrisTxt = this.add.text(width/2, 26, `0 / ${this._cfg.debris}`, {
        font: '13px "Courier New"', fill: '#88ccee'
      }).setDepth(89).setOrigin(0.5, 0);

      // Timer
      this._timerTxt = this.add.text(width - 12, 8, `${this._timeLeft}s`, {
        font: 'bold 20px "Courier New"', fill: '#ccffcc'
      }).setDepth(89).setOrigin(1, 0);

      // Hearts (drawn as images, left of timer area)
      this._heartImgs = [];
      for (let i = 0; i < 3; i++) {
        const h = this.add.image(width - 114 + i * 26, 27, 'heart').setDepth(89).setScale(1.0);
        this._heartImgs.push(h);
      }

      // Power-up active timer display — shown below HUD bar, centred
      this._powerupLineTxt = this.add.text(width / 2, 54, '', {
        font: 'bold 14px "Courier New"', fill: '#ffffff',
        stroke: '#000000', strokeThickness: 3,
        backgroundColor: '#00000099', padding: { x: 8, y: 3 }
      }).setDepth(90).setOrigin(0.5, 0).setAlpha(0);
    }

    _updateHUD(time) {
      this._scoreTxt.setText(`SCORE  ${this._score}`);
      this._debrisTxt.setText(`${this._collected} / ${this._cfg.debris} debris`);

      // Timer coloring
      let timerColor = '#ccffcc';
      if (this._timeLeft <= 10) {
        timerColor = '#ff2222';
        this._timerTxt.setAlpha(0.6 + 0.4 * Math.sin(time * 0.01));
      } else if (this._timeLeft <= 20) {
        timerColor = '#ffaa00';
        this._timerTxt.setAlpha(1);
      } else {
        this._timerTxt.setAlpha(1);
      }
      this._timerTxt.setText(`${this._timeLeft}s`).setStyle({ fill: timerColor });

      // Hearts — show/hide based on current health
      this._heartImgs.forEach((h, i) => h.setVisible(i < this._health));

      // Power-up active timer line below HUD bar (stacked if both active)
      const lines = [];
      if (this._shieldActive)  lines.push({ text: `SHIELD  ${Math.ceil(this._shieldTimer)}s`,  color: '#44ccff' });
      if (this._vacuumActive)  lines.push({ text: `SUPER VACUUM  ${Math.ceil(this._vacuumTimer)}s`, color: '#ffdd00' });

      if (lines.length > 0) {
        // Show first active (or both stacked via newline)
        const combined = lines.map(l => l.text).join('   ');
        const col = lines.length > 1 ? '#ffffff' : lines[0].color;
        this._powerupLineTxt.setText(combined).setStyle({ fill: col }).setAlpha(1);
      } else {
        this._powerupLineTxt.setAlpha(0);
      }
    }

    // ── PAUSE / RESUME ────────────────────────────────────────────────────────
    _pause() {
      this._paused = true;
      this._gameTimer.paused = true;
      this.physics.pause();
      this._pauseOverlay.setVisible(true);
    }
    _resume() {
      this._paused = false;
      this._gameTimer.paused = false;
      this.physics.resume();
      this._pauseOverlay.setVisible(false);
    }

    // ── END GAME ──────────────────────────────────────────────────────────────
    _endGame(won) {
      if (this._gameEnded) return;   // prevent double-trigger
      this._gameEnded = true;

      this._gameTimer.remove();
      this.physics.pause();

      if (won) {
        AM.playLevelCompleteSound();
        // Persist score and health for next level
        this.game.registry.set('score',  this._score);
        this.game.registry.set('health', this._health);
        this.time.delayedCall(700, () => {
          if (this._level >= TOTAL_LEVELS) {
            // All five levels cleared — show victory screen
            this.scene.start('GameOverScene', { missionComplete: true, score: this._score });
          } else {
            this.scene.start('LevelCompleteScene', {
              level: this._level, score: this._score, timeLeft: this._timeLeft
            });
          }
        });
      } else {
        AM.playGameOverSound();
        this.time.delayedCall(600, () => {
          this.scene.start('GameOverScene', {
            missionComplete: false, score: this._score, level: this._level
          });
        });
      }
    }
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // LEVEL COMPLETE SCENE
  // ═══════════════════════════════════════════════════════════════════════════
  class LevelCompleteScene extends Phaser.Scene {
    constructor() { super({ key: 'LevelCompleteScene' }); }

    init(data) {
      this._level    = data.level;
      this._score    = data.score;
      this._timeLeft = data.timeLeft || 0;
    }

    create() {
      this.game.registry.set('bgColor', 0x000011);
      buildStarfield(this, false);
      buildTextures(this);
      AM.playMenuMusic();

      const { width, height } = this.scale;
      const isLastLevel = (this._level >= TOTAL_LEVELS);
      const timeBonus   = this._timeLeft * 5;
      const totalScore  = this._score + timeBonus;
      const nextLevel   = this._level + 1;
      const nextCfg     = isLastLevel ? null : LEVELS[nextLevel - 1];

      // ── Slide-in container — starts above screen, tweens to y=0 ─────────
      const container = this.add.container(0, -300);

      // Panel background
      const panelGfx = this.add.graphics();
      panelGfx.fillStyle(0x001133, 0.90);
      panelGfx.fillRoundedRect(width/2 - 270, 80, 540, 440, 14);
      panelGfx.lineStyle(2, isLastLevel ? 0xffcc00 : 0x3366cc, 1);
      panelGfx.strokeRoundedRect(width/2 - 270, 80, 540, 440, 14);
      container.add(panelGfx);

      const addText = (x, y, txt, style) => {
        const t = this.add.text(x, y, txt, style).setOrigin(0.5);
        container.add(t);
        return t;
      };

      addText(width/2, 118, `LEVEL ${this._level} COMPLETE!`, {
        font: 'bold 38px "Courier New"', fill: isLastLevel ? '#ffdd44' : '#66ff88',
        stroke: isLastLevel ? '#664400' : '#004422', strokeThickness: 5,
        shadow: { color: isLastLevel ? '#ffaa00' : '#00ff88', blur: 20, fill: true }
      });

      addText(width/2, 185, `Score this level:`, {
        font: '17px "Courier New"', fill: '#aaddff'
      });
      addText(width/2, 213, `${this._score}`, {
        font: 'bold 34px "Courier New"', fill: '#ffdd44',
        stroke: '#664400', strokeThickness: 4
      });

      // Time Bonus calculation line
      addText(width/2, 260,
        `Time Bonus: ${this._timeLeft}s \u00d7 5 = +${timeBonus} pts`,
        { font: '17px "Courier New"', fill: '#66ff88' }
      );

      // Total score
      addText(width/2, 292, `Total Score: ${totalScore}`, {
        font: 'bold 26px "Courier New"', fill: '#ffee66',
        stroke: '#664400', strokeThickness: 3
      });

      // Next level preview (only if not last level)
      if (!isLastLevel) {
        addText(width/2, 340, `Next up \u2014 Level ${nextLevel}`, {
          font: '16px "Courier New"', fill: '#88aacc'
        });
        addText(width/2, 366,
          `${nextCfg.debris} debris  \u2022  ${nextCfg.timer}s  \u2022  ${nextCfg.enemies} enemies`,
          { font: '18px "Courier New"', fill: '#aabbdd' }
        );
      } else {
        addText(width/2, 348, 'ALL 5 LEVELS CLEARED!', {
          font: 'bold 22px "Courier New"', fill: '#ffcc00',
          stroke: '#664400', strokeThickness: 3
        });
        addText(width/2, 378, 'Earth\'s orbit is spotless.', {
          font: '16px "Courier New"', fill: '#aaffcc'
        });
      }

      // Action button — "[ NEXT LEVEL ]" or "[ MISSION COMPLETE ]"
      const btnLabel = isLastLevel ? '[ MISSION COMPLETE ]' : '[ NEXT LEVEL ]';
      const btn = this.add.text(width/2, 432, btnLabel, {
        font: 'bold 24px "Courier New"', fill: '#ffffff',
        backgroundColor: isLastLevel ? '#443300' : '#004400',
        padding: { x:20, y:12 },
        stroke: isLastLevel ? '#ffaa00' : '#00cc44', strokeThickness: 3
      }).setOrigin(0.5).setInteractive({ useHandCursor: true });
      container.add(btn);
      btn.on('pointerover', () => btn.setStyle({ backgroundColor: isLastLevel ? '#665500' : '#006600' }));
      btn.on('pointerout',  () => btn.setStyle({ backgroundColor: isLastLevel ? '#443300' : '#004400' }));
      btn.on('pointerdown', () => {
        if (isLastLevel) {
          // All levels done — go to victory GameOverScene
          this.scene.start('GameOverScene', { missionComplete: true, score: totalScore });
        } else {
          this.game.registry.set('currentLevel', nextLevel);
          this.game.registry.set('score', totalScore);
          AM.stopMusic();
          AM.playGameMusic();
          this.scene.start('GameScene');
        }
      });
      this.tweens.add({ targets: btn, scaleX:1.05, scaleY:1.05, duration:900, yoyo:true, repeat:-1 });

      // Slide panel in from top over 0.4 s
      this.tweens.add({ targets: container, y: 0, duration: 400, ease: 'Power2.easeOut' });
    }
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // GAME OVER SCENE
  // ═══════════════════════════════════════════════════════════════════════════
  class GameOverScene extends Phaser.Scene {
    constructor() { super({ key: 'GameOverScene' }); }

    init(data) {
      this._missionComplete = data.missionComplete;
      this._score           = data.score;
      this._level           = data.level || TOTAL_LEVELS;
    }

    create() {
      this.game.registry.set('bgColor', 0x000011);
      buildStarfield(this, false);
      buildTextures(this);

      const { width, height } = this.scale;
      AM.playMenuMusic();

      // Panel
      const panel = this.add.graphics();
      panel.fillStyle(0x110011, 0.88);
      panel.fillRoundedRect(width/2 - 280, 90, 560, 400, 14);
      panel.lineStyle(2, this._missionComplete ? 0x33cc66 : 0xcc3333, 1);
      panel.strokeRoundedRect(width/2 - 280, 90, 560, 400, 14);

      if (this._missionComplete) {
        this.add.text(width/2, 130, 'MISSION COMPLETE', {
          font: 'bold 40px "Courier New"', fill: '#66ff88',
          stroke: '#003322', strokeThickness: 6,
          shadow: { color: '#00ff88', blur: 28, fill: true }
        }).setOrigin(0.5);
        this.add.text(width/2, 188, 'Earth\'s orbit is spotless.\nThe VIP cruiser docks safely.', {
          font: '17px "Courier New"', fill: '#aaffcc', align: 'center', lineSpacing: 5
        }).setOrigin(0.5);
      } else {
        this.add.text(width/2, 130, 'MISSION FAILED', {
          font: 'bold 42px "Courier New"', fill: '#ff4444',
          stroke: '#330000', strokeThickness: 6,
          shadow: { color: '#ff0000', blur: 28, fill: true }
        }).setOrigin(0.5);
        this.add.text(width/2, 188, `Failed at Level ${this._level}\nOrbit still full of junk!`, {
          font: '17px "Courier New"', fill: '#ffaaaa', align: 'center', lineSpacing: 5
        }).setOrigin(0.5);
      }

      // Score
      this.add.text(width/2, 252, 'TOTAL SCORE', {
        font: '16px "Courier New"', fill: '#aabbcc'
      }).setOrigin(0.5);
      this.add.text(width/2, 286, `${this._score}`, {
        font: 'bold 46px "Courier New"', fill: '#ffdd44',
        stroke: '#664400', strokeThickness: 4
      }).setOrigin(0.5);

      // Stars rating
      const stars = this._score >= 300 ? '★★★' : this._score >= 150 ? '★★☆' : '★☆☆';
      this.add.text(width/2, 342, stars, {
        font: '40px "Courier New"', fill: '#ffcc00'
      }).setOrigin(0.5);

      // Restart button
      const label = this._missionComplete ? '[ PLAY AGAIN ]' : '[ RESTART FROM LEVEL 1 ]';
      const btn = this.add.text(width/2, 418, label, {
        font: 'bold 22px "Courier New"', fill: '#ffffff',
        backgroundColor: '#220033', padding: { x:18, y:11 },
        stroke: '#6633cc', strokeThickness: 3
      }).setOrigin(0.5).setInteractive({ useHandCursor: true });
      btn.on('pointerover', () => btn.setStyle({ backgroundColor: '#440066' }));
      btn.on('pointerout',  () => btn.setStyle({ backgroundColor: '#220033' }));
      btn.on('pointerdown', () => {
        // Always return to MenuScene on restart — never jump directly to GameScene
        this.game.registry.set('currentLevel', 1);
        this.game.registry.set('score', 0);
        this.game.registry.set('health', 3);
        AM.stopMusic();
        this.scene.start('MenuScene');
      });
      this.tweens.add({ targets: btn, scaleX:1.04, scaleY:1.04, duration:900, yoyo:true, repeat:-1 });
    }
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // PHASER GAME CONFIG
  // ═══════════════════════════════════════════════════════════════════════════
  const config = {
    type: Phaser.AUTO,
    width:  800,
    height: 600,
    parent: document.body,
    backgroundColor: '#000011',
    physics: {
      default: 'arcade',
      arcade: { gravity: { x:0, y:0 }, debug: false }
    },
    scene: [MenuScene, GameScene, LevelCompleteScene, GameOverScene]
  };

  const game = new Phaser.Game(config);
  </script>
</body>
